<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap">
<style>
/* Layout: one phone-width column. A round is the news in one line, one real headline on an airmail postcard, the world
   map as the board, and three numbered answers. The answer lands on the postcard as a rubber stamp. The full comparison
   (the old test page) sits one tap behind every round. */
:root{
  --bg:#B9F2E4; --sheet:#FFFFFF; --ink:#1C1259; --ink-2:#4A4580; --rule:#8FDCCB; --edge:#1C1259; --drop:#1C1259;
  --blue:#3348F5; --on-blue:#FFFFFF; --red:#F0246E; --marker:#FFE234; --on-marker:#1C1259;
  --ok:#00875A; --ok-bg:#D6F7E4; --bad:#D81E4F; --bad-bg:#FFE1EA; --on-pin:#FFFFFF;
  --sea:#58C7F3; --land:#FFFFFF; --dock:#1C1259; --on-dock:#FFFFFF;
  --a1:#FF4F9A; --a2:#5B7CFF; --a3:#FF9A1F; --a4:#A56BFF; --a5:#19C98A;
  --display:"Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  /* lens colours, carried over from the test page (checked with the dataviz palette validator) */
  --r1:#2a78d6; --r2:#eb6834; --r3:#1baf7a; --r4:#eda100; --r5:#e87ba4; --r6:#008300; --r7:#6250d6;
  --o-state:#eb6834; --o-public:#1baf7a; --o-private:#2a78d6; --o-nonprofit:#e87ba4;
  --c-state:#b4461b; --c-involved:#ee9a6a; --c-outside:#c9c7c0;
  --l-left:#1c5cab; --l-cl:#86b6ef; --l-centre:#b9b7b0; --l-cr:#e98f86; --l-right:#c43a39; --l-none:#e2e1dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160F45; --sheet:#241A66; --ink:#F5F2FF; --ink-2:#B9B0EA; --rule:#3D318F; --edge:#8F82F0; --drop:#07042A;
    --blue:#9DB0FF; --on-blue:#160F45; --red:#FF6FA5; --marker:#FFE234; --on-marker:#1C1259;
    --a1:#D93D80; --a2:#4A63D9; --a3:#D97A0B; --a4:#8650E0; --a5:#0FA06C;
    --ok:#46E3A4; --ok-bg:#123F4A; --bad:#FF7D9C; --bad-bg:#4A1646; --on-pin:#160F45;
    --sea:#1B2C9A; --land:#6F7DF2; --dock:#2E2380; --on-dock:#F5F2FF;
    --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#008300; --r7:#9085e9;
    --o-state:#d95926; --o-public:#199e70; --o-private:#3987e5; --o-nonprofit:#d55181;
    --c-state:#f08a58; --c-involved:#a5532e; --c-outside:#4b4f55;
    --l-left:#6da7ec; --l-cl:#2c5a96; --l-centre:#5a5d62; --l-cr:#8a3f3b; --l-right:#e66767; --l-none:#33373c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#160F45; --sheet:#241A66; --ink:#F5F2FF; --ink-2:#B9B0EA; --rule:#3D318F; --edge:#8F82F0; --drop:#07042A;
  --blue:#9DB0FF; --on-blue:#160F45; --red:#FF6FA5; --marker:#FFE234; --on-marker:#1C1259;
    --a1:#D93D80; --a2:#4A63D9; --a3:#D97A0B; --a4:#8650E0; --a5:#0FA06C;
  --ok:#46E3A4; --ok-bg:#123F4A; --bad:#FF7D9C; --bad-bg:#4A1646; --on-pin:#160F45;
  --sea:#1B2C9A; --land:#6F7DF2; --dock:#2E2380; --on-dock:#F5F2FF;
  --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#008300; --r7:#9085e9;
  --o-state:#d95926; --o-public:#199e70; --o-private:#3987e5; --o-nonprofit:#d55181;
  --c-state:#f08a58; --c-involved:#a5532e; --c-outside:#4b4f55;
  --l-left:#6da7ec; --l-cl:#2c5a96; --l-centre:#5a5d62; --l-cr:#8a3f3b; --l-right:#e66767; --l-none:#33373c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(104px + env(safe-area-inset-bottom, 0px))}
[hidden]{display:none!important}
.wrap{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.label{margin:0;font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.fine{margin:0;font-size:.86rem;color:var(--ink-2)}
h1,h2,h3{text-wrap:balance}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--edge);border-radius:12px;background:var(--sheet);
  padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--drop)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--drop)}
.btn.primary{background:var(--marker);color:var(--on-marker);border-color:var(--on-marker)}
.btn.big{font-size:1.15rem;padding:14px 20px;width:100%}
.btn.wa{background:var(--ok);color:var(--on-pin);border-color:var(--edge)}
.back{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--blue);font-weight:700;cursor:pointer}

/* masthead and home */
.mast{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{margin:0;font-weight:800;font-size:clamp(2.7rem, 13vw, 4.2rem);line-height:.92;letter-spacing:-.035em}
.dek{margin:0;font-size:1.12rem;line-height:1.4;max-width:30rem}
.done-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sheet);border:1.5px solid var(--edge);border-radius:14px;padding:14px}
.done-card b{font-size:1.9rem;font-weight:800;line-height:1}
.read{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding-top:18px;border-top:2px solid var(--ink)}
.read h2{margin:0;font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.slips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.slip{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:13px;cursor:pointer}
.slip:hover{border-color:var(--ink-2)}
.slip .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.slip .hl{font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.28;text-wrap:balance}
.count{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.count b{font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.count small{margin-top:3px;font-family:var(--mono);font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.meta{margin:0;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tick{font-size:.78rem;font-weight:700;color:var(--ok)}
.about{font-size:.85rem;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px}
.about p{margin:0}
.linkish{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:inherit}

/* the map */
.map{display:block;width:100%;height:auto;overflow:visible}
.map use{fill:var(--land)}
.mini use{fill:var(--rule)}
.slip .mini use{fill:color-mix(in srgb, var(--blue) 26%, var(--sheet))}
.map .cov{fill:var(--blue);fill-opacity:.5;stroke:var(--sheet);stroke-width:.5}
.map .cov.exile{fill:none;stroke:var(--blue);stroke-width:1.1;stroke-opacity:.9}
.boardbox{background:var(--sea);border:1.5px solid var(--edge);border-radius:14px;padding:8px 6px}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .dot{fill:var(--ink);stroke:var(--land);stroke-width:1.4}
.pin text{font-family:var(--display);font-weight:800;font-size:7.6px;text-anchor:middle;fill:var(--on-pin);pointer-events:none}
.pin .halo{fill:var(--ink);opacity:.35;transform-box:fill-box;transform-origin:center}
.pin.ok .dot{fill:var(--ok)} .pin.bad .dot{fill:var(--bad)} .pin.off .dot{fill:var(--ink-2)}
.pin.ok,.pin.bad,.pin.off{cursor:default}
.lead{stroke:var(--ink-2);stroke-width:.6}
.true{fill:var(--ink-2)}

/* a round */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tiles{display:flex;gap:5px}
.tiles i{display:block;width:16px;height:16px;border-radius:4px;background:var(--rule)}
.tiles i.now{background:none;box-shadow:inset 0 0 0 2px var(--ink)}
.tiles i.ok{background:var(--ok)} .tiles i.bad{background:var(--bad)}
.tiles.big i{width:34px;height:34px;border-radius:8px}
.newsline{display:flex;flex-direction:column;gap:3px}
.newsline p:last-child{margin:0;font-weight:600;font-size:1rem;line-height:1.3}
.postcard{position:relative;background:var(--sheet);border:1.5px solid var(--edge);border-radius:14px;box-shadow:6px 6px 0 var(--acc, var(--red));
  padding:20px 16px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.airmail{position:absolute;inset:0 0 auto 0;height:8px;
  background:repeating-linear-gradient(135deg, var(--red) 0 12px, var(--sheet) 12px 24px, var(--blue) 24px 36px, var(--sheet) 36px 48px)}
.postcard .hl{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(1.4rem, 6.2vw, 1.75rem);line-height:1.2;font-variation-settings:"opsz" 36;text-wrap:balance}
mark{background:var(--marker);color:var(--on-marker);padding:0 .12em;border-radius:3px}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:54px}
.by{margin:0;display:flex;flex-direction:column;font-size:.86rem;color:var(--ink-2);min-width:0}
.by b{font-size:1.02rem;color:var(--ink)}
.stamp{flex:none;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);text-transform:uppercase;color:var(--blue);
  border:2px solid var(--blue);border-radius:7px;padding:5px 11px 6px;transform:rotate(-5deg);line-height:1.15;
  box-shadow:inset 0 0 0 2px var(--sheet), inset 0 0 0 3.2px var(--blue)}
.stamp small{font-size:.58rem;letter-spacing:.14em}
.stamp b{font-size:.98rem;letter-spacing:.06em;font-weight:500}
.stamp.blank{border-style:dashed;box-shadow:none;color:var(--ink-2);border-color:var(--ink-2)}
.ask{margin:4px 0 0;font-weight:800;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}
.ask.ok{color:var(--ok)} .ask.bad{color:var(--bad)}
.ask span{display:block;font-weight:500;font-size:1rem;letter-spacing:0;color:var(--ink);margin-top:4px}
.answers{display:flex;flex-direction:column;gap:10px}
.ticket{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--edge);border-radius:12px;
  padding:12px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--drop);font-weight:700;font-size:1.1rem}
.ticket:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--drop)}
.badge{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--on-pin);font-weight:800;font-size:.9rem}
.dateline{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.dateline.ok{border:2px solid var(--ok);background:var(--ok-bg)}
.dateline.bad{border:2px solid var(--bad)}
.dateline .head{margin:0;display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem}
.dateline.ok .badge{background:var(--ok)} .dateline.bad .badge{background:var(--bad)} .dateline.off .badge{background:var(--ink-2)}
.note{margin-left:auto;font-family:var(--mono);font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;font-weight:500;color:var(--ink-2)}
.dateline.ok .note{color:var(--ok)} .dateline.bad .note{color:var(--bad)}
.dateline .who{margin:0;font-size:.86rem;color:var(--ink-2)}
.dateline .hl2{margin:0;font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.28}
.dateline a{font-size:.86rem;font-weight:700;align-self:flex-start}
.sub{margin:6px 0 -4px;font-weight:800;font-size:1.12rem;letter-spacing:-.01em}
.why{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:12px}
.why ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:8px;font-family:var(--serif);font-size:1.04rem;line-height:1.5}
.why strong,.analysis strong{font-family:var(--display);font-size:.95em;font-weight:700}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--dock);color:var(--on-dock);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dock .in{max-width:34rem;margin:0 auto;display:flex;align-items:center;gap:10px}
.dock button{border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.dock .ghost{background:none;border:1.5px solid var(--on-dock);color:var(--on-dock)}
.dock .go{flex:1;border:0;background:var(--marker);color:var(--on-marker)}

/* result */
.result{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.scoreline{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.score{margin:0;font-weight:800;font-size:clamp(5rem, 26vw, 7.5rem);line-height:.8;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.score span{font-size:.42em;letter-spacing:-.02em;color:var(--ink-2)}
.rank{margin:0;font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.row .btn{flex:1 1 12rem}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;width:100%}
.recap li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--rule)}
.recap i{flex:none;width:16px;height:16px;border-radius:4px;margin-top:3px}
.recap i.ok{background:var(--ok)} .recap i.bad{background:var(--bad)}
.recap p{margin:0;font-size:.95rem;line-height:1.3;min-width:0}
.recap small{display:block;color:var(--ink-2);font-size:.84rem}
.recap .links{display:flex;gap:14px;margin-top:3px}
.block{display:flex;flex-direction:column;gap:10px;width:100%;border-top:2px solid var(--ink);padding-top:14px}
.block h2{margin:0;font-weight:800;font-size:1.3rem;letter-spacing:-.02em}

/* the full picture (one story) */
.story{display:flex;flex-direction:column;gap:16px}
.story > .hl{margin:0;font-family:var(--serif);font-weight:650;font-size:1.65rem;line-height:1.2;font-variation-settings:"opsz" 40;text-wrap:balance}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px}
.places{display:flex;flex-wrap:wrap;gap:3px 12px;margin:10px 0 0;font-size:.85rem;color:var(--ink-2)}
.places b{color:var(--ink);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:3px;background:var(--bg);border-radius:9px;padding:3px;margin-top:12px}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:7px 2px;border-radius:7px;font-size:.84rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-pressed="true"]{background:var(--sheet);font-weight:700;box-shadow:0 0 0 1px var(--rule)}
.explain{margin:10px 0 0;font-size:.88rem;color:var(--ink-2)}
.bar{display:flex;height:14px;gap:2px;margin:10px 0 6px}
.bar span{display:block;min-width:3px}
.bar span:first-child{border-radius:4px 0 0 4px}.bar span:last-child{border-radius:0 4px 4px 0}
.bar span:only-child{border-radius:4px}
.groups{display:flex;flex-direction:column;gap:2px}
.grp{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer}
.grp:hover{background:var(--bg)}
.grp[aria-pressed="true"]{background:var(--marker);color:var(--on-marker)}
.grp[aria-pressed="true"] .who{color:var(--on-marker)}
.dot{flex:none;width:11px;height:11px;border-radius:3px;margin-top:5px}
.grp .name{display:block;font-weight:600;font-size:.92rem}
.grp .who{display:block;font-size:.82rem;color:var(--ink-2)}
.hint{margin:6px 0 0;font-size:.8rem;color:var(--ink-2)}
.analysis{display:flex;flex-direction:column;gap:6px}
.analysis section{display:flex;flex-direction:column;gap:7px;padding-top:14px;border-top:1px solid var(--rule)}
.analysis h3{margin:0;font-weight:800;font-size:1.2rem;letter-spacing:-.015em}
.analysis p{margin:0;font-family:var(--serif);font-size:1.08rem;line-height:1.55}
.analysis ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:8px;font-family:var(--serif);font-size:1.05rem;line-height:1.5}
.analysis .aside,.analysis .checks{font-family:var(--display);font-size:.85rem;color:var(--ink-2)}
.cite{display:inline-flex;align-items:center;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:999px;padding:0 7px;margin:0 1px;
  font-family:var(--display);font-size:.72em;font-weight:600;line-height:1.5;cursor:pointer;white-space:nowrap;vertical-align:.08em}
.cite:hover{border-color:var(--ink-2)}
.cite.on{background:var(--marker);color:var(--on-marker);border-color:var(--on-marker)}
.askbox{display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--edge);border-radius:12px;padding:14px;background:var(--sheet)}
.askbox h3{margin:0;font-weight:800;font-size:1.1rem}
.q{display:flex;flex-direction:column;gap:8px}
.q p{margin:0;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1px solid var(--ink-2);background:var(--bg);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:.92rem}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.saved{margin:0;font-size:.82rem;color:var(--ok);font-weight:600;min-height:1.2em}
.sources{display:flex;flex-direction:column}
.sources h3{margin:0 0 6px;font-weight:800;font-size:1.2rem;letter-spacing:-.015em}
.src{display:flex;flex-direction:column;gap:2px;padding:10px 6px;border-top:1px solid var(--rule);border-radius:6px}
.src.dim{opacity:.38}
.src .who{font-weight:700;font-size:.92rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-weight:500;font-size:.76rem;color:var(--ink-2)}
.tag i{display:inline-block;width:9px;height:9px;border-radius:2px}
.src a{font-family:var(--serif);font-size:1rem;line-height:1.35;text-underline-offset:2px}
.withheld{font-size:.85rem;color:var(--ink-2);font-style:italic}

/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:color-mix(in srgb, #05071A 55%, transparent);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--sheet);width:100%;max-width:34rem;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
.panel input,.panel textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;width:100%}
.panel textarea{min-height:4.5rem;resize:vertical}
.preview{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:var(--bg);border:1px dashed var(--rule);border-radius:8px;padding:10px;max-height:11rem;overflow:auto}


/* ---------- version 3: flags, globe, picture cards ---------- */
.flag{display:inline-block;flex:none;width:1.3em;height:.975em;border-radius:3px;background-size:cover;background-position:center;box-shadow:0 0 0 1px color-mix(in srgb, var(--ink) 28%, transparent);vertical-align:-.13em;margin-right:.36em}
.cite .flag{font-size:.95em;margin-right:.3em}
.stamp .flag{font-size:1.5rem;margin:2px 0 3px}
.places span{display:inline-flex;align-items:center}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.globe{flex:none;width:clamp(92px, 27vw, 128px);height:auto;overflow:visible;transform:rotate(-12deg)}
.globe .ocean{fill:var(--sea)} .globe .rim{fill:none;stroke:var(--edge);stroke-width:3}
.globe use{fill:var(--a5);stroke:var(--edge);stroke-width:.7}
.globe .shade{fill:url(#gshade)} .globe .axis{stroke:var(--edge);stroke-width:3;stroke-linecap:round}
.globe .cast{fill:var(--drop)} .globe .dotpin{fill:var(--red);stroke:var(--edge);stroke-width:1.5}
.poster{border:1.5px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--sheet)}
.poster .art{position:relative;height:92px;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--acc, var(--a1));border-bottom:1.5px solid var(--edge);overflow:hidden}
.poster .art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 4px 4px, rgba(255,255,255,.42) 1.6px, transparent 2px);background-size:11px 11px}
.poster .art::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.3);right:-40px;top:-70px}
.poster .art span{position:relative;z-index:1;font-size:3.1rem;line-height:1;filter:drop-shadow(3px 3px 0 rgba(20,10,70,.55))}
.poster .art span:nth-child(1){transform:rotate(-8deg)} .poster .art span:nth-child(2){transform:translateY(-4px) rotate(5deg) scale(1.12)} .poster .art span:nth-child(3){transform:rotate(10deg)}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-2deg);vertical-align:1px}
.poster .cap{padding:10px 14px 12px;display:flex;flex-direction:column;gap:3px}
.poster .cap p:last-child{margin:0;font-weight:700;font-size:1.05rem;line-height:1.3}
.slip .pic{flex:none;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;border:1.5px solid var(--edge);background:var(--acc, var(--a2));font-size:1.55rem;line-height:1;overflow:hidden;white-space:nowrap}
.slip .top{align-items:center}
.slip .hl{flex:1}
.ticket .flag,.dateline .head .flag{font-size:1.15em}
.hero .dek{font-weight:500}
.btn.primary{box-shadow:4px 4px 0 var(--red)}
@media (prefers-reduced-motion: no-preference){
  .globe .lands{animation:spin 16s linear infinite}
  .poster .art span{animation:bob 2.6s ease-in-out infinite alternate}
  .poster .art span:nth-child(2){animation-delay:-.9s} .poster .art span:nth-child(3){animation-delay:-1.7s}
}
@keyframes spin{to{transform:translateX(-200px)}}
@keyframes bob{to{translate:0 -5px}}

/* ---------- version 6 ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--edge);background:var(--sheet);color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none;cursor:pointer}
.covbar{display:flex;flex-direction:column;gap:4px}
.minibar{display:flex;height:8px;border-radius:8px;overflow:hidden;gap:2px}
.minibar i{display:block;height:100%}
.minilab{font-family:var(--mono);font-size:.72rem;color:var(--ink-2)}
.minilab b{color:var(--ink);font-weight:500}
.bs{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--marker);color:var(--on-marker);font-family:var(--mono);font-size:.7rem;letter-spacing:.04em}
.blind ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slip.mini{flex-direction:column;gap:6px;padding:11px 13px}
.slip .bs{align-self:flex-start}
.meta .bs{align-self:auto}
.slip.mini .hl{font-family:var(--serif);font-weight:700;font-size:1.02rem;line-height:1.3}
.search{display:block}
.search input{width:100%;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--edge);background:var(--sheet);color:var(--ink);font:inherit;font-size:1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.rchips button{flex:none;white-space:nowrap;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:.85rem;cursor:pointer}
.rchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 0;font-size:.82rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.timeline .first{margin:4px 0 2px;font-size:1rem}
.dots{position:relative;height:22px;margin:10px 6px 0;border-bottom:1.5px solid var(--rule)}
.dots i{position:absolute;bottom:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;border:1px solid var(--sheet)}
.ends{display:flex;justify-content:space-between;gap:8px;margin:6px 0 0;font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.bsline{margin:0;font-size:.95rem}
.ownedby{display:block;font-size:.8rem;color:var(--ink-2);margin-top:1px}
.flagit{margin-left:6px;border:0;background:none;padding:0;color:var(--ink-2);font-size:.75rem;text-decoration:underline dotted;cursor:pointer}
.flagit[aria-pressed="true"]{color:var(--red);text-decoration:none;font-weight:600}
.burst p{margin:4px 0 10px}

/* ---------- version 5: news first, game as the hook ---------- */
.brand{margin:0;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.dek.front{margin:-4px 0 0;font-size:1rem;color:var(--ink-2)}
.lead{background:var(--sheet);border:1.5px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:6px 6px 0 var(--acc)}
.lead .art{position:relative;height:84px;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--acc);border-bottom:1.5px solid var(--edge);overflow:hidden}
.lead .art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 4px 4px, rgba(255,255,255,.42) 1.6px, transparent 2px);background-size:11px 11px}
.lead .art span{position:relative;font-size:2.8rem;line-height:1;filter:drop-shadow(3px 3px 0 rgba(20,10,70,.55))}
.lead .art span:nth-child(2){transform:translateY(-5px) scale(1.12)}
.lead-in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.lead h1{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(1.5rem, 6.4vw, 2rem);line-height:1.15;letter-spacing:-.01em;text-transform:none}
.lead .meta{margin:0;font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.lead .split{margin:2px 0 4px;font-family:var(--serif);font-size:1.02rem;line-height:1.45}
.gamecard{position:relative;background:#1C1259;color:#fff;border:1.5px solid #1C1259;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 var(--red);transform:rotate(-.6deg)}
.gamecard .label{color:var(--marker)}
.gamecard h2{margin:2px 0 0;font-size:1.7rem;line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:#fff}
.gamecard .label{color:#FFE234}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gamecard{border-color:var(--edge)} }
:root[data-theme="dark"] .gamecard{border-color:var(--edge)}
.gamecard h2 mark{display:inline-block;transform:rotate(-2.5deg);padding:0 .12em;border-radius:6px}
.gc-top{display:flex;align-items:center;gap:12px}
.gamecard .globe{width:74px;transform:rotate(-12deg)}
.gamecard .globe .rim{stroke:#fff}
.gc-line{margin:0;font-size:1rem;line-height:1.4}
.gamecard .tiles i:not(.ok):not(.bad){background:transparent;border-color:#fff}
.gamecard .btn.primary{box-shadow:4px 4px 0 var(--red)}

/* ---------- version 2: Ed, bets, points, press pass ---------- */
.ticker{margin:-14px -16px 0;background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.ticker span{display:inline-block;padding-right:2rem}
.hero h1 mark{display:inline-block;transform:rotate(-2.5deg);padding:0 .12em;border-radius:6px}
.hero h1{text-transform:uppercase}
.ed{display:flex;gap:10px;align-items:flex-start}
.face{flex:none;width:46px;height:46px;overflow:visible}
.face .skin{fill:var(--sheet);stroke:var(--edge);stroke-width:1.6}
.face .visor{fill:var(--ok);stroke:var(--edge);stroke-width:1.4;stroke-linejoin:round}
.face .lens{fill:none;stroke:var(--edge);stroke-width:1.4}
.face .eye{fill:var(--edge)}
.face .line{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round}
.bubble{position:relative;flex:1;min-width:0;background:var(--sheet);border:1.5px solid var(--edge);border-radius:4px 14px 14px 14px;padding:10px 12px 11px;box-shadow:3px 3px 0 var(--drop);display:flex;flex-direction:column;gap:4px}
.bubble p{margin:0}
.bubble .line1{font-weight:700;font-size:1.06rem;line-height:1.3}
.bubble .tell{font-family:var(--serif);font-size:1.04rem;line-height:1.42}
.ed.ok .bubble{background:var(--ok-bg);border-color:var(--ok)}
.ed.bad .bubble{background:var(--bad-bg);border-color:var(--bad)}
.pts{align-self:flex-start;font-family:var(--mono);font-weight:500;font-size:.95rem;border-radius:999px;padding:1px 10px;border:1.5px solid currentColor;transform:rotate(-3deg);margin-top:2px}
.pts.ok{color:var(--ok)} .pts.bad{color:var(--bad)} .pts.nil{color:var(--ink-2)}
.purse{font-family:var(--mono);font-weight:500;font-size:.82rem;background:var(--marker);color:var(--on-marker);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .label{white-space:nowrap}
.bets{display:flex;flex-direction:column;gap:7px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--edge);background:var(--sheet);border-radius:12px;padding:8px 4px;cursor:pointer;line-height:1.15;min-width:0}
.chip b{font-size:.95rem;font-weight:800;text-align:center}
.chip small{font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:3px 3px 0 var(--red);transform:rotate(-1.5deg)}
.chip[aria-pressed="true"] small{color:var(--marker)}
.hintbtn{align-self:flex-start;background:none;border:0;border-bottom:2px dotted var(--ink-2);padding:2px 0;color:var(--ink);font-weight:600;font-size:.92rem;cursor:pointer}
.hinted{font-size:.88rem;color:var(--ink-2);margin:0}
.pass{position:relative;width:100%;margin-bottom:8px;background:var(--sheet);border:1.5px solid var(--edge);border-radius:16px;box-shadow:6px 6px 0 var(--drop);padding:30px 16px 16px;display:flex;flex-direction:column;gap:10px;transform:rotate(-1.2deg);overflow:hidden}
.pass::before{content:"";position:absolute;top:10px;left:50%;width:46px;height:9px;margin-left:-23px;border-radius:9px;background:var(--bg);border:1.5px solid var(--edge)}
.pass .strip{position:absolute;inset:auto 0 0 0;height:8px;background:repeating-linear-gradient(135deg, var(--red) 0 12px, var(--sheet) 12px 24px, var(--blue) 24px 36px, var(--sheet) 36px 48px)}
.pass .title{margin:0;font-weight:800;font-size:clamp(2rem, 10vw, 2.9rem);line-height:.98;letter-spacing:-.03em;text-transform:uppercase}
.pass .big{margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.9rem;color:var(--ink-2)}
.pass .big b{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pass .tiles{margin:2px 0 8px}
.tiles i.hot{box-shadow:0 0 0 2px var(--sheet), 0 0 0 4px var(--marker)}
.recap .rp{margin-left:auto;flex:none;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.recap .rp.ok{color:var(--ok)} .recap .rp.bad{color:var(--bad)}
.scrap{position:fixed;z-index:20;width:9px;height:14px;top:0;left:0;pointer-events:none;border-radius:2px}
@media (prefers-reduced-motion: no-preference){
  .ticker span{animation:tick 22s linear infinite}
  .ed .bubble{animation:pop .28s cubic-bezier(.2,1.4,.4,1) both;transform-origin:0 0}
  .pts{animation:thunk2 .4s .18s cubic-bezier(.2,1.5,.4,1) both}
  .shake{animation:shake .38s both}
  .pass{animation:drop .5s cubic-bezier(.2,1.3,.4,1) both}
  .scrap{animation:fly var(--t,1s) cubic-bezier(.1,.6,.4,1) forwards}
  .chip{transition:transform .08s, box-shadow .08s}
}
@keyframes tick{to{transform:translateX(-100%)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes thunk2{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}

@keyframes drop{from{transform:translateY(-40px) rotate(6deg);opacity:0}to{transform:rotate(-1.2deg);opacity:1}}

@media (prefers-reduced-motion: no-preference){
  .pin .halo{animation:halo 1.6s ease-out infinite}
  .stamped .stamp{animation:thunk .34s cubic-bezier(.2,1.5,.4,1) both}

  .dateline:nth-child(2){animation-delay:.07s} .dateline:nth-child(3){animation-delay:.14s}
  .btn,.ticket{transition:transform .06s, box-shadow .06s}
}

function game(){

const pts = i => { const g = game(); return g.picks[i] === null ? 0 : isRight(i) ? worth(i) * g.bets[i] : -50 * (g.bets[i] - 1); };

function spots(opts){  // where each numbered pin sits; pins that would overlap are nudged apart and keep a line to the real spot
  const P = opts.map(o => { const [lon, lat] = PLACES[o.country]; return {x: lon + 130, y: 75 - lat, tx: lon + 130, ty: 75 - lat}; });
  for (let k = 0; k < 14; k++) for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    let dx = P[j].x - P[i].x, dy = P[j].y - P[i].y; const d = Math.hypot(dx, dy) || 0.01;
    if (d < 16) { const m = (16 - d) / 2; dx /= d; dy /= d; P[i].x -= dx * m; P[i].y -= dy * m; P[j].x += dx * m; P[j].y += dy * m; }
  }

/* ---------- text of the comparison ---------- */
function nums(group){
  const out = [];
  for (const part of group.split(",")) {
    const p = part.trim(), r = p.match(/^(\d+)\s*-\s*(\d+)$/);
    if (r) { const a = +r[1], b = +r[2]; if (b >= a && b - a < 60) for (let n = a; n <= b; n++) out.push(n); }
    else if (/^\d+$/.test(p)) out.push(+p);
  }
  return out;
}
// A citation like [14] becomes a small pill naming who wrote it: the outlet, or its country when the sentence already names the outlet.
function inline(raw, s){
  const html = flagged(esc(raw).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"), s);
  return html.replace(/\[(\d[\d,\s-]*)\]/g, (m, g) => {
    const list = nums(g).filter(n => s.articles[n - 1]);
    if (!list.length) return m;
    const a = s.articles[list[0] - 1], named = raw.includes(a.outlet) || (SHORT[a.outlet] && raw.includes(SHORT[a.outlet]));
    const text = (named ? a.country : (SHORT[a.outlet] || a.outlet)) + (list.length > 1 ? ` +${list.length - 1}` : "");
    return `<button type="button" class="cite" data-sid="${esc(s.sid)}" data-ns="${list.join(",")}" aria-label="Who wrote that: ${esc(list.map(n => s.articles[n - 1].outlet).join(", "))}">${named ? flag(a.country) : ""}${esc(text)}</button>`;
  });
}
function render(md, s){
  const parts = []; let part = null, list = null;
  const flush = () => { if (list) { part.body += `<ul>${list}</ul>`; list = null; } };
  for (const rawLine of md.split("\n")) {
    const l = rawLine.trim();
    if (l.startsWith("## ")) {
      flush();
      const check = /^## check/i.test(l), plain = l.slice(3).replace(/^\d+\.\s*/, "");
      part = {title: check ? "How this was checked" : (SECTION[plain.toLowerCase()] || plain), body: "", check};
      parts.push(part); continue;
    }
    if (!part || !l || l.startsWith("Status:")) continue;
    if (l.startsWith("- ")) { list = (list || "") + `<li>${inline(l.slice(2), s)}</li>`; continue; }
    flush();
    if (part.check) part.body += `<p class="checks">${esc(l.replace(/^check_quotes\.py and check_outlets\.py:\s*/, "Automatic checks: "))}</p>`;
    else if (/^(summaries are short|these summaries are short)/i.test(l)) part.body += `<p class="aside">${inline(l, s)}</p>`;
    else part.body += `<p>${inline(l, s)}</p>`;
  }
  flush();
  return parts.map(p => `<section><h3>${esc(p.title)}</h3>${p.body}</section>`).join("");
}
function groupsFor(s, L){
  const g = {};
  s.articles.forEach((a, i) => { const k = L.key(a); (g[k] = g[k] || []).push(i + 1); });
  const keys = L.order.filter(k => g[k]).concat(Object.keys(g).filter(k => !L.order.includes(k)));
  return keys.map(k => ({k, n: g[k], name: L.names[k] || k, short: (L.short || {})[k] || L.names[k] || k, color: L.color(k) || "var(--l-none)"}));
}

  if (m.rated >= 8 && m.side.left / m.rated < 0.15) return "Left-leaning outlets barely covered it";

}

    app.querySelectorAll(".ticket").forEach(b => b.onclick = () => choose(+b.dataset.i));
    app.querySelectorAll(".pin").forEach(p => p.onclick = () => choose(+p.dataset.i));
    app.querySelectorAll(".chip").forEach(b => b.onclick = () => { g.bets[cur] = +b.dataset.k; persist();
      app.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    const hb = document.getElementById("hint");
    if (hb) hb.onclick = () => { g.hints[cur] = true; persist(); const y = scrollY; play(true); scrollTo(0, y); };
    setDock("");
  } else {
    const last = cur === R - 1;
    setDock(`<button type="button" class="ghost" id="deep">Full picture</button><button type="button" class="go" id="next">${last ? "Face Ed's verdict" : "Next headline"} &rarr;</button>`);
    document.getElementById("deep").onclick = () => { fromGame = true; location.hash = r.sid; };
    document.getElementById("next").onclick = () => {
      if (last) { location.hash = "result"; return; }
      cur += 1; play();
    };
  }
  if (!keepScroll) scrollTo(0, 0);
}

/* ---------- result ---------- */
function shareText(){
  const lines = [`Spin the Globe on News Lens · ${new Date(DAY + "T12:00:00").toLocaleDateString(undefined, {day: "numeric", month: "short"})}`,
    `${squares()} ${total()} pts`, `Ed the night editor calls me "${verdict()[0]}".`, "Same news, different countries. Can you tell who wrote what? Then see how the whole world told it."];
  if (DATA.url) lines.push(DATA.url);
  return lines.join("\n");
}
const LABEL = {learned: {yes: "learned something new", no: "nothing new"}, sides: {no: "didn't take sides", little: "took sides a little", yes: "took sides"}};
function feedbackText(){
  const lines = ["Spin the Globe: my feedback" + (saved.who ? ` (${saved.who})` : "")];
  if (R) lines.push(`Score: ${total()} pts, ${score()}/${R} right ${squares()} · ${verdict()[0]} · bets ${game().bets.join("")} · hints ${game().hints.filter(Boolean).length}`);
  lines.push(`Fun: ${saved.fun || "?"} · Would play again: ${saved.again || "?"}`);
  STORIES.forEach(s => {
    const a = saved.answers[s.sid]; if (!a || (!a.learned && !a.sides)) return;
    const t = s.title.length > 48 ? s.title.slice(0, 46).trimEnd() + "..." : s.title;
    lines.push(`${t} (${s.sid}): ${a.learned ? LABEL.learned[a.learned] : "?"}; ${a.sides ? LABEL.sides[a.sides] : "?"}`);
  });
  const fl = Object.keys(saved.flags || {});
  if (fl.length) lines.push("", "Labels I think are wrong: " + fl.join(", "));
  if (saved.comment) lines.push("", "Comment: " + saved.comment);
  lines.push("", `[run ${DATA.run}]`);
  return lines.join("\n");
}
function copyText(text, note, box){
  const fallback = () => {
    if (box) { const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    note.textContent = box ? "Text selected. Copy it, then paste it into a message." : "Couldn't copy here. Use the WhatsApp button instead.";
  };
  try { navigator.clipboard.writeText(text).then(() => { note.textContent = "Copied. Paste it into a message."; }, fallback); } catch (e) { fallback(); }
}
function result(){
  if (!done()) { location.hash = R ? "play" : ""; return; }
  setDock("");
  const g = game(), inGame = new Set(ROUNDS.map(r => r.sid)), rest = STORIES.filter(s => !inGame.has(s.sid)), v = verdict();
  const opt = (q, v, label) => `<button type="button" data-q="${q}" data-v="${v}" aria-pressed="${saved[q] === v}">${label}</button>`;
  app.innerHTML = `
  <header class="mast"><button type="button" class="back" id="quit">&larr; Home</button><p class="label">${esc(dayLabel)}</p></header>
  <section class="result">
    <div class="pass"><p class="label">Press pass &middot; Spin the Globe</p>
      <p class="title">${esc(v[0])}</p>
      <p class="big"><b>${total()}</b> of ${300 * R} points &middot; ${score()} of ${R} right</p>${tiles(-1, true)}<div class="strip"></div></div>
    ${ed(`<p class="line1">${esc(v[1])}</p><p class="tell">${esc(worstMoment())}</p>`, score() / R >= .8 ? "ok" : "")}
    ${saved.streak.n > 1 ? `<p class="fine">${saved.streak.n}-day streak. Ed has noticed.</p>` : `<p class="fine">Come back for the next edition to start a streak.</p>`}
    <div class="row"><a class="btn wa" id="wa" href="https://wa.me/?text=${encodeURIComponent(shareText())}" target="_blank" rel="noopener">Dare a friend on WhatsApp</a>
      <button type="button" class="btn" id="copy">Copy my result</button></div>
    <p class="fine" id="copied" aria-live="polite"></p>
  </section>
  <section class="block"><h2>Your ${R === 5 ? "five" : R}</h2><ul class="recap">${ROUNDS.map((r, i) => { const m = r.options[r.answer], ok = g.picks[i] === r.answer, p = pts(i);
    return `<li><i class="${ok ? "ok" : "bad"}"></i><p>${esc(BY[r.sid].title)}<small>${flag(m.country)}Written in ${esc(the(m.country))}, by ${esc(m.outlet)}${ok ? "" : `. You said ${esc(the(r.options[g.picks[i]].country))}`}. ${["On a hunch", "Sure of it", "Byline on the line"][g.bets[i] - 1]}${g.hints[i] ? ", with the red pen" : ""}.</small>
      <span class="links"><button type="button" class="linkish" data-round="${i}">See the round</button><button type="button" class="linkish" data-sid="${esc(r.sid)}">Full picture</button></span></p><span class="rp ${p > 0 ? "ok" : p < 0 ? "bad" : ""}">${signed(p)}</span></li>`; }).join("")}</ul></section>
  ${rest.length ? `<section class="block"><h2>Now see how the world told today's news</h2>${slips(rest)}</section>` : ""}
  <section class="block"><h2>Ten seconds of feedback</h2>
    <div class="q"><p>Was that fun?</p><div class="opts">${opt("fun", "yes", "Yes")}${opt("fun", "a bit", "A bit")}${opt("fun", "no", "No")}</div></div>
    <div class="q"><p>Would you play again tomorrow?</p><div class="opts">${opt("again", "yes", "Yes")}${opt("again", "maybe", "Maybe")}${opt("again", "no", "No")}</div></div>
    <button type="button" class="btn" id="send">Send my feedback</button></section>`;
  document.getElementById("quit").onclick = () => { location.hash = ""; };
  document.getElementById("copy").onclick = () => copyText(shareText(), document.getElementById("copied"));
  app.querySelectorAll("[data-round]").forEach(b => b.onclick = () => { cur = +b.dataset.round; location.hash = "play"; });
  app.querySelectorAll(".recap [data-sid]").forEach(b => b.onclick = () => { fromGame = false; location.hash = b.dataset.sid; });
  app.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
    saved[b.dataset.q] = b.dataset.v; persist();
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  document.getElementById("send").onclick = openFeedback;
  bindSlips();
  scrollTo(0, 0);
}
function openFeedback(){
  openSheet(`<h2>Send your feedback</h2><p class="fine">It goes into a WhatsApp message you send yourself, to whoever shared this with you. Nothing is sent until you press Send in WhatsApp.</p>
    <label for="who">Your first name (optional)<input id="who" type="text" autocomplete="given-name" maxlength="40"></label>
    <label for="comment">Anything else? (optional)<textarea id="comment" maxlength="600" placeholder="What did you like, what was confusing, would you use this?"></textarea></label>
    <pre class="preview" id="preview"></pre>
    <div class="row"><a class="btn wa" id="fwa" href="https://wa.me/" target="_blank" rel="noopener">Send on WhatsApp</a><button type="button" class="btn" id="fcopy">Copy text</button><button type="button" class="btn" data-close>Back</button></div>
    <p class="fine" id="fnote" aria-live="polite"></p>`);
  const who = document.getElementById("who"), comment = document.getElementById("comment"), pre = document.getElementById("preview");
  const refresh = () => { const t = feedbackText(); pre.textContent = t; document.getElementById("fwa").href = "https://wa.me/?text=" + encodeURIComponent(t); };
  who.value = saved.who; comment.value = saved.comment; refresh();
  who.oninput = () => { saved.who = who.value.trim(); persist(); refresh(); };
  comment.oninput = () => { saved.comment = comment.value.trim(); persist(); refresh(); };
  document.getElementById("fcopy").onclick = () => copyText(feedbackText(), document.getElementById("fnote"), pre);
}

/* ---------- the full picture ---------- */
function lensCard(s, gs, L){
  const total = s.articles.length, outletsOf = n => [...new Set(n.map(i => s.articles[i - 1].outlet))];
  return `<section class="card" aria-label="Who covered it">
    <p class="label">Where the ${total} articles came from</p>${worldMap(s, true)}
    <p class="places">${countries(s).map(([k, n]) => `<span>${flag(k)}${esc(k)}&nbsp;<b>${n}</b></span>`).join("")}</p>
    <div class="tabs" role="group" aria-label="Sort the outlets by">${Object.entries(LENSES).map(([k, v]) =>
      `<button type="button" data-lens="${k}" aria-pressed="${k === lens}">${v.label}</button>`).join("")}</div>
    <p class="explain">${esc(L.explain(s))}</p>
    <div class="bar" role="img" aria-label="${esc(gs.map(g => `${g.name}: ${g.n.length}`).join(", "))}">${gs.map(g =>
      `<span style="flex:${g.n.length};background:${g.color}" title="${esc(g.name)}: ${g.n.length}"></span>`).join("")}</div>
    <div class="groups">${gs.map(g => `<button type="button" class="grp" data-k="${esc(g.k)}" aria-pressed="${picked === g.k}">
      <span class="dot" style="background:${g.color}"></span><span><span class="name">${esc(g.name)} &middot; ${g.n.length} of ${total}</span>
      <span class="who">${esc(outletsOf(g.n).join(", "))}</span></span></button>`).join("")}</div>
    <p class="hint">Tap a group to mark what its outlets wrote in the comparison above.</p></section>`;
}
function askBox(s){
  const a = saved.answers[s.sid] || {};
  const opt = (q, v, label) => `<button type="button" data-q="${q}" data-v="${v}" aria-pressed="${a[q] === v}">${label}</button>`;
  return `<section class="askbox" aria-label="Your answers"><h3>Two quick questions</h3>
    <div class="q"><p>Did this show you something you wouldn't get from reading one or two articles?</p>
      <div class="opts">${opt("learned", "yes", "Yes")}${opt("learned", "no", "Not really")}</div></div>
    <div class="q"><p>Did the comparison take sides?</p>
      <div class="opts">${opt("sides", "no", "No")}${opt("sides", "little", "A little")}${opt("sides", "yes", "Yes")}</div></div>
    <p class="saved" aria-live="polite">${answered(s.sid) ? "Saved in this browser." : ""}</p></section>`;
}
function story(sid, keepScroll){
  const s = BY[sid];
  if (!s) return home();
  setDock("");
  const L = LENSES[lens], gs = groupsFor(s, L), groupOf = {};
  gs.forEach(g => g.n.forEach(n => groupOf[n] = g));
  const sel = picked !== null ? new Set((gs.find(g => g.k === picked) || {n: []}).n) : null;
  rememberRead(s);
  saved.flags = saved.flags || {};
  app.innerHTML = `<article class="story">
    <button type="button" class="back" id="quit">&larr; ${fromGame ? "Back to the game" : "Home"}</button>
    <p class="label">The full picture</p>
    <h2 class="hl">${esc(s.title)}</h2>
    <p class="meta">${s.articles.length} articles &middot; ${s.outlets} outlets &middot; ${countries(s).length} countries</p>
    <div class="analysis">${render(s.body, s)}</div>
    ${lensCard(s, gs, L)}
    ${timeline(s)}
    ${blindspot(s) ? `<p class="bsline"><span class="bs">Blindspot</span> ${esc(blindspot(s))}.</p>` : ""}
    ${askBox(s)}
    <section class="sources" aria-label="All the articles"><h3>All ${s.articles.length} articles</h3>${s.articles.map((a, i) => {
      const g = groupOf[i + 1];
      return `<div class="src${sel ? (sel.has(i + 1) ? "" : " dim") : ""}" id="a${i + 1}">
        <span class="who">${esc(a.outlet)}<span class="tag"><i style="background:${g.color}"></i>${esc(g.short)}</span></span>
        <span class="meta">${flag(a.country)}${esc(cname(a.country))} &middot; ${esc(kind(a))}${a.published ? ` &middot; ${esc(when(a.published))}` : ""}
          <button type="button" class="flagit" data-o="${esc(a.outlet)}" aria-pressed="${!!saved.flags[a.outlet]}">${saved.flags[a.outlet] ? "Label flagged" : "Label wrong?"}</button></span>
        ${a.parent ? `<span class="ownedby">Owned by ${esc(a.parent)}</span>` : ""}${sourceLine(a)}</div>`;
    }).join("")}</section>
  </article>`;
  if (sel) app.querySelectorAll(".analysis .cite").forEach(c => { if (c.dataset.ns.split(",").some(n => sel.has(+n))) c.classList.add("on"); });
  document.getElementById("quit").onclick = () => { picked = null; location.hash = fromGame ? "play" : ""; };
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { lens = b.dataset.lens; picked = null; story(sid, true); });
  app.querySelectorAll(".grp").forEach(b => b.onclick = () => { picked = picked === b.dataset.k ? null : b.dataset.k; story(sid, true); });
  app.querySelectorAll(".askbox .opts button").forEach(b => b.onclick = () => {
    saved.answers[s.sid] = Object.assign({}, saved.answers[s.sid], {[b.dataset.q]: b.dataset.v}); persist();
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    app.querySelector(".saved").textContent = answered(s.sid) ? "Saved in this browser." : "One more to go.";
  });
  app.querySelectorAll(".flagit").forEach(b => b.onclick = () => {
    const o = b.dataset.o; saved.flags[o] = !saved.flags[o]; if (!saved.flags[o]) delete saved.flags[o]; persist();
    app.querySelectorAll(`.flagit[data-o="${CSS.escape(o)}"]`).forEach(x => { x.setAttribute("aria-pressed", !!saved.flags[o]); x.textContent = saved.flags[o] ? "Label flagged" : "Label wrong?"; });
  });
  if (!keepScroll) scrollTo(0, 0);
}

const route = () => {
  if (!sheet.hidden) closeSheet();
  const h = location.hash.slice(1);
  if (h === "play") play(); else if (h === "result") result(); else if (h === "me") me(); else if (h) story(h); else home();
};
addEventListener("hashchange", () => { picked = null; route(); });
route();
</script>
</body>
</html>
