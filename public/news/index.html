    ? `<h3 class="sub">Same news, three datelines</h3><div class="answers">${r.options.map((o, i) => {

        const note = i === r.answer ? (right ? "your pick, correct" : "the answer") : i === pick ? "your pick" : "";

          <p class="who">${esc(o.outlet)} &middot; ${esc(kind(o))}</p><p class="hl2">${marked(o)}</p>${o.sanctioned ? `<p class="withheld">${SANCTION_NOTE}</p>` : ""}
          ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Read the article</a>` : ""}</div>`; }).join("")}</div>`

      <div class="answers">${r.options.map((o, i) => `<button type="button" class="ticket" data-i="${i}"><span class="badge">${i + 1}</span>${flag(o.country)}${esc(cname(o.country))}</button>`).join("")}</div>`;

  const edBox = shown
    ? ed(`<p class="line1">${esc(SAY[(right ? "ok" : "no") + bet][cur % 5])}${right && hint ? " You did need my red pen, mind." : ""}</p>

  ${pic(s).length ? `<div class="poster" style="--acc:${ACC(cur)}"><div class="art" aria-hidden="true">${pic(s).map(e => `<span>${e}</span>`).join("")}</div>

      <div class="stamp${shown ? "" : " blank"}"><small>Written in</small>${shown ? flag(m.country) : ""}<b>${shown ? esc(cname(m.country)) : "?"}</b></div></div></article>

function feedbackText(){

}

  <section class="block"><h2>Ten seconds of feedback</h2>
    <div class="q"><p>Was that fun?</p><div class="opts">${opt("fun", "yes", "Yes")}${opt("fun", "a bit", "A bit")}${opt("fun", "no", "No")}</div></div>
    <div class="q"><p>Would you play again tomorrow?</p><div class="opts">${opt("again", "yes", "Yes")}${opt("again", "maybe", "Maybe")}${opt("again", "no", "No")}</div></div>
    <button type="button" class="btn" id="send">Send my feedback</button></section>`;
  document.getElementById("quit").onclick = () => { location.hash = ""; };
  document.getElementById("copy").onclick = () => copyText(shareText(), document.getElementById("copied"));
  app.querySelectorAll("[data-round]").forEach(b => b.onclick = () => { cur = +b.dataset.round; location.hash = "play"; });
  app.querySelectorAll(".recap [data-sid]").forEach(b => b.onclick = () => { fromGame = false; location.hash = b.dataset.sid; });
  app.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
    saved[b.dataset.q] = b.dataset.v; persist();
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  document.getElementById("send").onclick = openFeedback;
  bindSlips();
  scrollTo(0, 0);
}
function openFeedback(){
  openSheet(`<h2>Send your feedback</h2><p class="fine">It goes into a WhatsApp message you send yourself, to whoever shared this with you. Nothing is sent until you press Send in WhatsApp.</p>
    <label for="who">Your first name (optional)<input id="who" type="text" autocomplete="given-name" maxlength="40"></label>
    <label for="comment">Anything else? (optional)<textarea id="comment" maxlength="600" placeholder="What did you like, what was confusing, would you use this?"></textarea></label>
    <pre class="preview" id="preview"></pre>
    <div class="row"><a class="btn wa" id="fwa" href="https://wa.me/" target="_blank" rel="noopener">Send on WhatsApp</a><button type="button" class="btn" id="fcopy">Copy text</button><button type="button" class="btn" data-close>Back</button></div>
    <p class="fine" id="fnote" aria-live="polite"></p>`);
  const who = document.getElementById("who"), comment = document.getElementById("comment"), pre = document.getElementById("preview");
  const refresh = () => { const t = feedbackText(); pre.textContent = t; document.getElementById("fwa").href = "https://wa.me/?text=" + encodeURIComponent(t); };
  who.value = saved.who; comment.value = saved.comment; refresh();
  who.oninput = () => { saved.who = who.value.trim(); persist(); refresh(); };
  comment.oninput = () => { saved.comment = comment.value.trim(); persist(); refresh(); };
  document.getElementById("fcopy").onclick = () => copyText(feedbackText(), document.getElementById("fnote"), pre);
}

/* ---------- the full picture ---------- */
function lensCard(s, gs, L){
  const total = s.articles.length, outletsOf = n => [...new Set(n.map(i => s.articles[i - 1].outlet))];
  return `<section class="card" aria-label="Who covered it">
    <p class="label">Where the ${total} articles came from</p>${worldMap(s, true)}
    <p class="places">${countries(s).map(([k, n]) => `<span>${flag(k)}${esc(k)}&nbsp;<b>${n}</b></span>`).join("")}</p>
    <div class="tabs" role="group" aria-label="Sort the outlets by">${Object.entries(LENSES).map(([k, v]) =>
      `<button type="button" data-lens="${k}" aria-pressed="${k === lens}">${v.label}</button>`).join("")}</div>
    <p class="explain">${esc(L.explain(s))}</p>
    <div class="bar" role="img" aria-label="${esc(gs.map(g => `${g.name}: ${g.n.length}`).join(", "))}">${gs.map(g =>
      `<span style="flex:${g.n.length};background:${g.color}" title="${esc(g.name)}: ${g.n.length}"></span>`).join("")}</div>
    <div class="groups">${gs.map(g => `<button type="button" class="grp" data-k="${esc(g.k)}" aria-pressed="${picked === g.k}">
      <span class="dot" style="background:${g.color}"></span><span><span class="name">${esc(g.name)} &middot; ${g.n.length} of ${total}</span>
      <span class="who">${esc(outletsOf(g.n).join(", "))}</span></span></button>`).join("")}</div>
    <p class="hint">Tap a group to mark what its outlets wrote in the comparison above.</p></section>`;
}
function askBox(s){
  const a = saved.answers[s.sid] || {};
  const opt = (q, v, label) => `<button type="button" data-q="${q}" data-v="${v}" aria-pressed="${a[q] === v}">${label}</button>`;
  return `<section class="askbox" aria-label="Your answers"><h3>Two quick questions</h3>
    <div class="q"><p>Did this show you something you wouldn't get from reading one or two articles?</p>
      <div class="opts">${opt("learned", "yes", "Yes")}${opt("learned", "no", "Not really")}</div></div>
    <div class="q"><p>Did the comparison take sides?</p>
      <div class="opts">${opt("sides", "no", "No")}${opt("sides", "little", "A little")}${opt("sides", "yes", "Yes")}</div></div>
    <p class="saved" aria-live="polite">${answered(s.sid) ? "Saved in this browser." : ""}</p></section>`;
}
function story(sid, keepScroll){
  const s = BY[sid];
  if (!s) return home();
  setDock("");
  const L = LENSES[lens], gs = groupsFor(s, L), groupOf = {};
  gs.forEach(g => g.n.forEach(n => groupOf[n] = g));
  const sel = picked !== null ? new Set((gs.find(g => g.k === picked) || {n: []}).n) : null;
  rememberRead(s);
  saved.flags = saved.flags || {};
  app.innerHTML = `<article class="story">
    <button type="button" class="back" id="quit">&larr; ${fromGame ? "Back to the game" : "Home"}</button>
    <p class="label">The full picture</p>
    <h2 class="hl">${esc(s.title)}</h2>
    <p class="meta">${s.articles.length} articles &middot; ${s.outlets} outlets &middot; ${countries(s).length} countries</p>
    <div class="analysis">${render(s.body, s)}</div>
    ${lensCard(s, gs, L)}
    ${timeline(s)}
    ${blindspot(s) ? `<p class="bsline"><span class="bs">Blindspot</span> ${esc(blindspot(s))}.</p>` : ""}
    ${askBox(s)}
    <section class="sources" aria-label="All the articles"><h3>All ${s.articles.length} articles</h3>${s.articles.map((a, i) => {
      const g = groupOf[i + 1];
      return `<div class="src${sel ? (sel.has(i + 1) ? "" : " dim") : ""}" id="a${i + 1}">
        <span class="who">${esc(a.outlet)}<span class="tag"><i style="background:${g.color}"></i>${esc(g.short)}</span></span>
        <span class="meta">${flag(a.country)}${esc(cname(a.country))} &middot; ${esc(kind(a))}${a.published ? ` &middot; ${esc(when(a.published))}` : ""}
          <button type="button" class="flagit" data-o="${esc(a.outlet)}" aria-pressed="${!!saved.flags[a.outlet]}">${saved.flags[a.outlet] ? "Label flagged" : "Label wrong?"}</button></span>
        ${a.parent ? `<span class="ownedby">Owned by ${esc(a.parent)}</span>` : ""}${sourceLine(a)}</div>`;
    }).join("")}</section>
  </article>`;
  if (sel) app.querySelectorAll(".analysis .cite").forEach(c => { if (c.dataset.ns.split(",").some(n => sel.has(+n))) c.classList.add("on"); });
  document.getElementById("quit").onclick = () => { picked = null; location.hash = fromGame ? "play" : ""; };
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { lens = b.dataset.lens; picked = null; story(sid, true); });
  app.querySelectorAll(".grp").forEach(b => b.onclick = () => { picked = picked === b.dataset.k ? null : b.dataset.k; story(sid, true); });
  app.querySelectorAll(".askbox .opts button").forEach(b => b.onclick = () => {
    saved.answers[s.sid] = Object.assign({}, saved.answers[s.sid], {[b.dataset.q]: b.dataset.v}); persist();
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    app.querySelector(".saved").textContent = answered(s.sid) ? "Saved in this browser." : "One more to go.";
  });
  app.querySelectorAll(".flagit").forEach(b => b.onclick = () => {
    const o = b.dataset.o; saved.flags[o] = !saved.flags[o]; if (!saved.flags[o]) delete saved.flags[o]; persist();
    app.querySelectorAll(`.flagit[data-o="${CSS.escape(o)}"]`).forEach(x => { x.setAttribute("aria-pressed", !!saved.flags[o]); x.textContent = saved.flags[o] ? "Label flagged" : "Label wrong?"; });
  });
  if (!keepScroll) scrollTo(0, 0);
}

const route = () => {
  if (!sheet.hidden) closeSheet();
  const h = location.hash.slice(1);
  if (h === "play") play(); else if (h === "result") result(); else if (h === "me") me(); else if (h) story(h); else home();
};
addEventListener("hashchange", () => { picked = null; route(); });
route();
</script>
</body>
</html>
