<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap">
<style>
/* Layout: one phone-width column. A round is the news in one line, one real headline on an airmail postcard, the world
   map as the board, and three numbered answers. The answer lands on the postcard as a rubber stamp. The full comparison
   (the old test page) sits one tap behind every round. */
:root{
  --bg:#B9F2E4; --sheet:#FFFFFF; --ink:#1C1259; --ink-2:#4A4580; --rule:#8FDCCB; --edge:#1C1259; --drop:#1C1259;
  --blue:#3348F5; --on-blue:#FFFFFF; --red:#F0246E; --marker:#FFE234; --on-marker:#1C1259;
  --ok:#00875A; --ok-bg:#D6F7E4; --bad:#D81E4F; --bad-bg:#FFE1EA; --on-pin:#FFFFFF;
  --sea:#58C7F3; --land:#FFFFFF; --dock:#1C1259; --on-dock:#FFFFFF;
  --a1:#FF4F9A; --a2:#5B7CFF; --a3:#FF9A1F; --a4:#A56BFF; --a5:#19C98A;
  --display:"Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  /* lens colours, carried over from the test page (checked with the dataviz palette validator) */
  --r1:#2a78d6; --r2:#eb6834; --r3:#1baf7a; --r4:#eda100; --r5:#e87ba4; --r6:#008300; --r7:#6250d6;
  --o-state:#eb6834; --o-public:#1baf7a; --o-private:#2a78d6; --o-nonprofit:#e87ba4;
  --c-state:#b4461b; --c-involved:#ee9a6a; --c-outside:#c9c7c0;
  --l-left:#1c5cab; --l-cl:#86b6ef; --l-centre:#b9b7b0; --l-cr:#e98f86; --l-right:#c43a39; --l-none:#e2e1dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160F45; --sheet:#241A66; --ink:#F5F2FF; --ink-2:#B9B0EA; --rule:#3D318F; --edge:#8F82F0; --drop:#07042A;
    --blue:#9DB0FF; --on-blue:#160F45; --red:#FF6FA5; --marker:#FFE234; --on-marker:#1C1259;
    --a1:#D93D80; --a2:#4A63D9; --a3:#D97A0B; --a4:#8650E0; --a5:#0FA06C;
    --ok:#46E3A4; --ok-bg:#123F4A; --bad:#FF7D9C; --bad-bg:#4A1646; --on-pin:#160F45;
    --sea:#1B2C9A; --land:#6F7DF2; --dock:#2E2380; --on-dock:#F5F2FF;
    --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#008300; --r7:#9085e9;
    --o-state:#d95926; --o-public:#199e70; --o-private:#3987e5; --o-nonprofit:#d55181;
    --c-state:#f08a58; --c-involved:#a5532e; --c-outside:#4b4f55;
    --l-left:#6da7ec; --l-cl:#2c5a96; --l-centre:#5a5d62; --l-cr:#8a3f3b; --l-right:#e66767; --l-none:#33373c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#160F45; --sheet:#241A66; --ink:#F5F2FF; --ink-2:#B9B0EA; --rule:#3D318F; --edge:#8F82F0; --drop:#07042A;
  --blue:#9DB0FF; --on-blue:#160F45; --red:#FF6FA5; --marker:#FFE234; --on-marker:#1C1259;
    --a1:#D93D80; --a2:#4A63D9; --a3:#D97A0B; --a4:#8650E0; --a5:#0FA06C;
  --ok:#46E3A4; --ok-bg:#123F4A; --bad:#FF7D9C; --bad-bg:#4A1646; --on-pin:#160F45;
  --sea:#1B2C9A; --land:#6F7DF2; --dock:#2E2380; --on-dock:#F5F2FF;
  --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#008300; --r7:#9085e9;
  --o-state:#d95926; --o-public:#199e70; --o-private:#3987e5; --o-nonprofit:#d55181;
  --c-state:#f08a58; --c-involved:#a5532e; --c-outside:#4b4f55;
  --l-left:#6da7ec; --l-cl:#2c5a96; --l-centre:#5a5d62; --l-cr:#8a3f3b; --l-right:#e66767; --l-none:#33373c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(104px + env(safe-area-inset-bottom, 0px))}
[hidden]{display:none!important}
.wrap{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.label{margin:0;font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.fine{margin:0;font-size:.86rem;color:var(--ink-2)}
h1,h2,h3{text-wrap:balance}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--edge);border-radius:12px;background:var(--sheet);
  padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--drop)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--drop)}
.btn.primary{background:var(--marker);color:var(--on-marker);border-color:var(--on-marker)}
.btn.big{font-size:1.15rem;padding:14px 20px;width:100%}
.btn.wa{background:var(--ok);color:var(--on-pin);border-color:var(--edge)}
.back{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--blue);font-weight:700;cursor:pointer}

/* masthead and home */
.mast{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{margin:0;font-weight:800;font-size:clamp(2.7rem, 13vw, 4.2rem);line-height:.92;letter-spacing:-.035em}
.dek{margin:0;font-size:1.12rem;line-height:1.4;max-width:30rem}
.done-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sheet);border:1.5px solid var(--edge);border-radius:14px;padding:14px}
.done-card b{font-size:1.9rem;font-weight:800;line-height:1}
.read{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding-top:18px;border-top:2px solid var(--ink)}
.read h2{margin:0;font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.slips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.slip{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:13px;cursor:pointer}
.slip:hover{border-color:var(--ink-2)}
.slip .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.slip .hl{font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.28;text-wrap:balance}
.count{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.count b{font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.count small{margin-top:3px;font-family:var(--mono);font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.meta{margin:0;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tick{font-size:.78rem;font-weight:700;color:var(--ok)}
.about{font-size:.85rem;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px}
.about p{margin:0}
.linkish{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:inherit}

/* the map */
.map{display:block;width:100%;height:auto;overflow:visible}
.map use{fill:var(--land)}
.mini use{fill:var(--rule)}
.slip .mini use{fill:color-mix(in srgb, var(--blue) 26%, var(--sheet))}
.map .cov{fill:var(--blue);fill-opacity:.5;stroke:var(--sheet);stroke-width:.5}
.map .cov.exile{fill:none;stroke:var(--blue);stroke-width:1.1;stroke-opacity:.9}
.boardbox{background:var(--sea);border:1.5px solid var(--edge);border-radius:14px;padding:8px 6px}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .dot{fill:var(--ink);stroke:var(--land);stroke-width:1.4}
.pin text{font-family:var(--display);font-weight:800;font-size:7.6px;text-anchor:middle;fill:var(--on-pin);pointer-events:none}
.pin .halo{fill:var(--ink);opacity:.35;transform-box:fill-box;transform-origin:center}
.pin.ok .dot{fill:var(--ok)} .pin.bad .dot{fill:var(--bad)} .pin.off .dot{fill:var(--ink-2)}
.pin.ok,.pin.bad,.pin.off{cursor:default}
.lead{stroke:var(--ink-2);stroke-width:.6}
.true{fill:var(--ink-2)}

/* a round */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tiles{display:flex;gap:5px}
.tiles i{display:block;width:16px;height:16px;border-radius:4px;background:var(--rule)}
.tiles i.now{background:none;box-shadow:inset 0 0 0 2px var(--ink)}
.tiles i.ok{background:var(--ok)} .tiles i.bad{background:var(--bad)}
.tiles.big i{width:34px;height:34px;border-radius:8px}
.newsline{display:flex;flex-direction:column;gap:3px}
.newsline p:last-child{margin:0;font-weight:600;font-size:1rem;line-height:1.3}
.postcard{position:relative;background:var(--sheet);border:1.5px solid var(--edge);border-radius:14px;box-shadow:6px 6px 0 var(--acc, var(--red));
  padding:20px 16px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.airmail{position:absolute;inset:0 0 auto 0;height:8px;
  background:repeating-linear-gradient(135deg, var(--red) 0 12px, var(--sheet) 12px 24px, var(--blue) 24px 36px, var(--sheet) 36px 48px)}
.postcard .hl{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(1.4rem, 6.2vw, 1.75rem);line-height:1.2;font-variation-settings:"opsz" 36;text-wrap:balance}
mark{background:var(--marker);color:var(--on-marker);padding:0 .12em;border-radius:3px}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:54px}
.by{margin:0;display:flex;flex-direction:column;font-size:.86rem;color:var(--ink-2);min-width:0}
.by b{font-size:1.02rem;color:var(--ink)}
.stamp{flex:none;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);text-transform:uppercase;color:var(--blue);
  border:2px solid var(--blue);border-radius:7px;padding:5px 11px 6px;transform:rotate(-5deg);line-height:1.15;
  box-shadow:inset 0 0 0 2px var(--sheet), inset 0 0 0 3.2px var(--blue)}
.stamp small{font-size:.58rem;letter-spacing:.14em}
.stamp b{font-size:.98rem;letter-spacing:.06em;font-weight:500}
.stamp.blank{border-style:dashed;box-shadow:none;color:var(--ink-2);border-color:var(--ink-2)}
.ask{margin:4px 0 0;font-weight:800;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}
.ask.ok{color:var(--ok)} .ask.bad{color:var(--bad)}
.ask span{display:block;font-weight:500;font-size:1rem;letter-spacing:0;color:var(--ink);margin-top:4px}
.answers{display:flex;flex-direction:column;gap:10px}
.ticket{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--edge);border-radius:12px;
  padding:12px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--drop);font-weight:700;font-size:1.1rem}
.ticket:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--drop)}
.badge{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--on-pin);font-weight:800;font-size:.9rem}
.dateline{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.dateline.ok{border:2px solid var(--ok);background:var(--ok-bg)}
.dateline.bad{border:2px solid var(--bad)}
.dateline .head{margin:0;display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem}
.dateline.ok .badge{background:var(--ok)} .dateline.bad .badge{background:var(--bad)} .dateline.off .badge{background:var(--ink-2)}
.note{margin-left:auto;font-family:var(--mono);font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;font-weight:500;color:var(--ink-2)}
.dateline.ok .note{color:var(--ok)} .dateline.bad .note{color:var(--bad)}
.dateline .who{margin:0;font-size:.86rem;color:var(--ink-2)}
.dateline .hl2{margin:0;font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.28}
.dateline a{font-size:.86rem;font-weight:700;align-self:flex-start}
.sub{margin:6px 0 -4px;font-weight:800;font-size:1.12rem;letter-spacing:-.01em}
.why{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:12px}
.why ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:8px;font-family:var(--serif);font-size:1.04rem;line-height:1.5}
.why strong,.analysis strong{font-family:var(--display);font-size:.95em;font-weight:700}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--dock);color:var(--on-dock);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dock .in{max-width:34rem;margin:0 auto;display:flex;align-items:center;gap:10px}
.dock button{border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.dock .ghost{background:none;border:1.5px solid var(--on-dock);color:var(--on-dock)}
.dock .go{flex:1;border:0;background:var(--marker);color:var(--on-marker)}

/* result */
.result{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.scoreline{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.score{margin:0;font-weight:800;font-size:clamp(5rem, 26vw, 7.5rem);line-height:.8;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.score span{font-size:.42em;letter-spacing:-.02em;color:var(--ink-2)}
.rank{margin:0;font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.row .btn{flex:1 1 12rem}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;width:100%}
.recap li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--rule)}
.recap i{flex:none;width:16px;height:16px;border-radius:4px;margin-top:3px}
.recap i.ok{background:var(--ok)} .recap i.bad{background:var(--bad)}
.recap p{margin:0;font-size:.95rem;line-height:1.3;min-width:0}
.recap small{display:block;color:var(--ink-2);font-size:.84rem}
.recap .links{display:flex;gap:14px;margin-top:3px}
.block{display:flex;flex-direction:column;gap:10px;width:100%;border-top:2px solid var(--ink);padding-top:14px}
.block h2{margin:0;font-weight:800;font-size:1.3rem;letter-spacing:-.02em}

/* the full picture (one story) */
.story{display:flex;flex-direction:column;gap:16px}
.story > .hl{margin:0;font-family:var(--serif);font-weight:650;font-size:1.65rem;line-height:1.2;font-variation-settings:"opsz" 40;text-wrap:balance}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px}
.places{display:flex;flex-wrap:wrap;gap:3px 12px;margin:10px 0 0;font-size:.85rem;color:var(--ink-2)}
.places b{color:var(--ink);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:3px;background:var(--bg);border-radius:9px;padding:3px;margin-top:12px}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:7px 2px;border-radius:7px;font-size:.84rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-pressed="true"]{background:var(--sheet);font-weight:700;box-shadow:0 0 0 1px var(--rule)}
.explain{margin:10px 0 0;font-size:.88rem;color:var(--ink-2)}
.bar{display:flex;height:14px;gap:2px;margin:10px 0 6px}
.bar span{display:block;min-width:3px}
.bar span:first-child{border-radius:4px 0 0 4px}.bar span:last-child{border-radius:0 4px 4px 0}
.bar span:only-child{border-radius:4px}
.groups{display:flex;flex-direction:column;gap:2px}
.grp{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer}
.grp:hover{background:var(--bg)}
.grp[aria-pressed="true"]{background:var(--marker);color:var(--on-marker)}
.grp[aria-pressed="true"] .who{color:var(--on-marker)}
.dot{flex:none;width:11px;height:11px;border-radius:3px;margin-top:5px}
.grp .name{display:block;font-weight:600;font-size:.92rem}
.grp .who{display:block;font-size:.82rem;color:var(--ink-2)}
.hint{margin:6px 0 0;font-size:.8rem;color:var(--ink-2)}
.analysis{display:flex;flex-direction:column;gap:6px}
.analysis section{display:flex;flex-direction:column;gap:7px;padding-top:14px;border-top:1px solid var(--rule)}
.analysis h3{margin:0;font-weight:800;font-size:1.2rem;letter-spacing:-.015em}
.analysis p{margin:0;font-family:var(--serif);font-size:1.08rem;line-height:1.55}
.analysis ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:8px;font-family:var(--serif);font-size:1.05rem;line-height:1.5}
.analysis .aside,.analysis .checks{font-family:var(--display);font-size:.85rem;color:var(--ink-2)}
.cite{display:inline-flex;align-items:center;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:999px;padding:0 7px;margin:0 1px;
  font-family:var(--display);font-size:.72em;font-weight:600;line-height:1.5;cursor:pointer;white-space:nowrap;vertical-align:.08em}
.cite:hover{border-color:var(--ink-2)}
.cite.on{background:var(--marker);color:var(--on-marker);border-color:var(--on-marker)}
.askbox{display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--edge);border-radius:12px;padding:14px;background:var(--sheet)}
.askbox h3{margin:0;font-weight:800;font-size:1.1rem}
.q{display:flex;flex-direction:column;gap:8px}
.q p{margin:0;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1px solid var(--ink-2);background:var(--bg);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:.92rem}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.saved{margin:0;font-size:.82rem;color:var(--ok);font-weight:600;min-height:1.2em}
.sources{display:flex;flex-direction:column}
.sources h3{margin:0 0 6px;font-weight:800;font-size:1.2rem;letter-spacing:-.015em}
.src{display:flex;flex-direction:column;gap:2px;padding:10px 6px;border-top:1px solid var(--rule);border-radius:6px}
.src.dim{opacity:.38}
.src .who{font-weight:700;font-size:.92rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-weight:500;font-size:.76rem;color:var(--ink-2)}
.tag i{display:inline-block;width:9px;height:9px;border-radius:2px}
.src a{font-family:var(--serif);font-size:1rem;line-height:1.35;text-underline-offset:2px}
.withheld{font-size:.85rem;color:var(--ink-2);font-style:italic}

/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:color-mix(in srgb, #05071A 55%, transparent);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--sheet);width:100%;max-width:34rem;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
.panel input,.panel textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;width:100%}
.panel textarea{min-height:4.5rem;resize:vertical}
.preview{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:var(--bg);border:1px dashed var(--rule);border-radius:8px;padding:10px;max-height:11rem;overflow:auto}


/* ---------- version 3: flags, globe, picture cards ---------- */
.flag{display:inline-block;flex:none;width:1.3em;height:.975em;border-radius:3px;background-size:cover;background-position:center;box-shadow:0 0 0 1px color-mix(in srgb, var(--ink) 28%, transparent);vertical-align:-.13em;margin-right:.36em}
.cite .flag{font-size:.95em;margin-right:.3em}
.stamp .flag{font-size:1.5rem;margin:2px 0 3px}
.places span{display:inline-flex;align-items:center}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.globe{flex:none;width:clamp(92px, 27vw, 128px);height:auto;overflow:visible;transform:rotate(-12deg)}
.globe .ocean{fill:var(--sea)} .globe .rim{fill:none;stroke:var(--edge);stroke-width:3}
.globe use{fill:var(--a5);stroke:var(--edge);stroke-width:.7}
.globe .shade{fill:url(#gshade)} .globe .axis{stroke:var(--edge);stroke-width:3;stroke-linecap:round}
.globe .cast{fill:var(--drop)} .globe .dotpin{fill:var(--red);stroke:var(--edge);stroke-width:1.5}
.poster{border:1.5px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--sheet)}
.poster .art{position:relative;height:92px;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--acc, var(--a1));border-bottom:1.5px solid var(--edge);overflow:hidden}
.poster .art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 4px 4px, rgba(255,255,255,.42) 1.6px, transparent 2px);background-size:11px 11px}
.poster .art::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.3);right:-40px;top:-70px}
.poster .art span{position:relative;z-index:1;font-size:3.1rem;line-height:1;filter:drop-shadow(3px 3px 0 rgba(20,10,70,.55))}
.poster .art span:nth-child(1){transform:rotate(-8deg)} .poster .art span:nth-child(2){transform:translateY(-4px) rotate(5deg) scale(1.12)} .poster .art span:nth-child(3){transform:rotate(10deg)}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-2deg);vertical-align:1px}
.poster .cap{padding:10px 14px 12px;display:flex;flex-direction:column;gap:3px}
.poster .cap p:last-child{margin:0;font-weight:700;font-size:1.05rem;line-height:1.3}
.slip .pic{flex:none;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;border:1.5px solid var(--edge);background:var(--acc, var(--a2));font-size:1.55rem;line-height:1;overflow:hidden;white-space:nowrap}
.slip .top{align-items:center}
.slip .hl{flex:1}
.ticket .flag,.dateline .head .flag{font-size:1.15em}
.hero .dek{font-weight:500}
.btn.primary{box-shadow:4px 4px 0 var(--red)}
@media (prefers-reduced-motion: no-preference){
  .globe .lands{animation:spin 16s linear infinite}
  .poster .art span{animation:bob 2.6s ease-in-out infinite alternate}
  .poster .art span:nth-child(2){animation-delay:-.9s} .poster .art span:nth-child(3){animation-delay:-1.7s}
}
@keyframes spin{to{transform:translateX(-200px)}}
@keyframes bob{to{translate:0 -5px}}

/* ---------- version 6 ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--edge);background:var(--sheet);color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none;cursor:pointer}
.covbar{display:flex;flex-direction:column;gap:4px}
.minibar{display:flex;height:8px;border-radius:8px;overflow:hidden;gap:2px}
.minibar i{display:block;height:100%}
.minilab{font-family:var(--mono);font-size:.72rem;color:var(--ink-2)}
.minilab b{color:var(--ink);font-weight:500}
.bs{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--marker);color:var(--on-marker);font-family:var(--mono);font-size:.7rem;letter-spacing:.04em}
.blind ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slip.mini{flex-direction:column;gap:6px;padding:11px 13px}
.slip .bs{align-self:flex-start}
.meta .bs{align-self:auto}
.slip.mini .hl{font-family:var(--serif);font-weight:700;font-size:1.02rem;line-height:1.3}
.search{display:block}
.search input{width:100%;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--edge);background:var(--sheet);color:var(--ink);font:inherit;font-size:1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.rchips button{flex:none;white-space:nowrap;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:.85rem;cursor:pointer}
.rchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 0;font-size:.82rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.timeline .first{margin:4px 0 2px;font-size:1rem}
.dots{position:relative;height:22px;margin:10px 6px 0;border-bottom:1.5px solid var(--rule)}
.dots i{position:absolute;bottom:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;border:1px solid var(--sheet)}
.ends{display:flex;justify-content:space-between;gap:8px;margin:6px 0 0;font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.bsline{margin:0;font-size:.95rem}
.ownedby{display:block;font-size:.8rem;color:var(--ink-2);margin-top:1px}
.flagit{margin-left:6px;border:0;background:none;padding:0;color:var(--ink-2);font-size:.75rem;text-decoration:underline dotted;cursor:pointer}
.flagit[aria-pressed="true"]{color:var(--red);text-decoration:none;font-weight:600}
.burst p{margin:4px 0 10px}

/* ---------- version 5: news first, game as the hook ---------- */
.brand{margin:0;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.dek.front{margin:-4px 0 0;font-size:1rem;color:var(--ink-2)}
.lead{background:var(--sheet);border:1.5px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:6px 6px 0 var(--acc)}
.lead .art{position:relative;height:84px;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--acc);border-bottom:1.5px solid var(--edge);overflow:hidden}
.lead .art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 4px 4px, rgba(255,255,255,.42) 1.6px, transparent 2px);background-size:11px 11px}
.lead .art span{position:relative;font-size:2.8rem;line-height:1;filter:drop-shadow(3px 3px 0 rgba(20,10,70,.55))}
.lead .art span:nth-child(2){transform:translateY(-5px) scale(1.12)}
.lead-in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.lead h1{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(1.5rem, 6.4vw, 2rem);line-height:1.15;letter-spacing:-.01em;text-transform:none}
.lead .meta{margin:0;font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.lead .split{margin:2px 0 4px;font-family:var(--serif);font-size:1.02rem;line-height:1.45}
.gamecard{position:relative;background:#1C1259;color:#fff;border:1.5px solid #1C1259;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 var(--red);transform:rotate(-.6deg)}
.gamecard .label{color:var(--marker)}
.gamecard h2{margin:2px 0 0;font-size:1.7rem;line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:#fff}
.gamecard .label{color:#FFE234}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gamecard{border-color:var(--edge)} }
:root[data-theme="dark"] .gamecard{border-color:var(--edge)}
.gamecard h2 mark{display:inline-block;transform:rotate(-2.5deg);padding:0 .12em;border-radius:6px}
.gc-top{display:flex;align-items:center;gap:12px}
.gamecard .globe{width:74px;transform:rotate(-12deg)}
.gamecard .globe .rim{stroke:#fff}
.gc-line{margin:0;font-size:1rem;line-height:1.4}
.gamecard .tiles i:not(.ok):not(.bad){background:transparent;border-color:#fff}
.gamecard .btn.primary{box-shadow:4px 4px 0 var(--red)}

/* ---------- version 2: Ed, bets, points, press pass ---------- */
.ticker{margin:-14px -16px 0;background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.ticker span{display:inline-block;padding-right:2rem}
.hero h1 mark{display:inline-block;transform:rotate(-2.5deg);padding:0 .12em;border-radius:6px}
.hero h1{text-transform:uppercase}
.ed{display:flex;gap:10px;align-items:flex-start}
.face{flex:none;width:46px;height:46px;overflow:visible}
.face .skin{fill:var(--sheet);stroke:var(--edge);stroke-width:1.6}
.face .visor{fill:var(--ok);stroke:var(--edge);stroke-width:1.4;stroke-linejoin:round}
.face .lens{fill:none;stroke:var(--edge);stroke-width:1.4}
.face .eye{fill:var(--edge)}
.face .line{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round}
.bubble{position:relative;flex:1;min-width:0;background:var(--sheet);border:1.5px solid var(--edge);border-radius:4px 14px 14px 14px;padding:10px 12px 11px;box-shadow:3px 3px 0 var(--drop);display:flex;flex-direction:column;gap:4px}
.bubble p{margin:0}
.bubble .line1{font-weight:700;font-size:1.06rem;line-height:1.3}
.bubble .tell{font-family:var(--serif);font-size:1.04rem;line-height:1.42}
.ed.ok .bubble{background:var(--ok-bg);border-color:var(--ok)}
.ed.bad .bubble{background:var(--bad-bg);border-color:var(--bad)}
.pts{align-self:flex-start;font-family:var(--mono);font-weight:500;font-size:.95rem;border-radius:999px;padding:1px 10px;border:1.5px solid currentColor;transform:rotate(-3deg);margin-top:2px}
.pts.ok{color:var(--ok)} .pts.bad{color:var(--bad)} .pts.nil{color:var(--ink-2)}
.purse{font-family:var(--mono);font-weight:500;font-size:.82rem;background:var(--marker);color:var(--on-marker);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .label{white-space:nowrap}
.bets{display:flex;flex-direction:column;gap:7px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--edge);background:var(--sheet);border-radius:12px;padding:8px 4px;cursor:pointer;line-height:1.15;min-width:0}
.chip b{font-size:.95rem;font-weight:800;text-align:center}
.chip small{font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:3px 3px 0 var(--red);transform:rotate(-1.5deg)}
.chip[aria-pressed="true"] small{color:var(--marker)}
.hintbtn{align-self:flex-start;background:none;border:0;border-bottom:2px dotted var(--ink-2);padding:2px 0;color:var(--ink);font-weight:600;font-size:.92rem;cursor:pointer}
.hinted{font-size:.88rem;color:var(--ink-2);margin:0}
.pass{position:relative;width:100%;margin-bottom:8px;background:var(--sheet);border:1.5px solid var(--edge);border-radius:16px;box-shadow:6px 6px 0 var(--drop);padding:30px 16px 16px;display:flex;flex-direction:column;gap:10px;transform:rotate(-1.2deg);overflow:hidden}
.pass::before{content:"";position:absolute;top:10px;left:50%;width:46px;height:9px;margin-left:-23px;border-radius:9px;background:var(--bg);border:1.5px solid var(--edge)}
.pass .strip{position:absolute;inset:auto 0 0 0;height:8px;background:repeating-linear-gradient(135deg, var(--red) 0 12px, var(--sheet) 12px 24px, var(--blue) 24px 36px, var(--sheet) 36px 48px)}
.pass .title{margin:0;font-weight:800;font-size:clamp(2rem, 10vw, 2.9rem);line-height:.98;letter-spacing:-.03em;text-transform:uppercase}
.pass .big{margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.9rem;color:var(--ink-2)}
.pass .big b{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pass .tiles{margin:2px 0 8px}
.tiles i.hot{box-shadow:0 0 0 2px var(--sheet), 0 0 0 4px var(--marker)}
.recap .rp{margin-left:auto;flex:none;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.recap .rp.ok{color:var(--ok)} .recap .rp.bad{color:var(--bad)}
.scrap{position:fixed;z-index:20;width:9px;height:14px;top:0;left:0;pointer-events:none;border-radius:2px}
@media (prefers-reduced-motion: no-preference){
  .ticker span{animation:tick 22s linear infinite}
  .ed .bubble{animation:pop .28s cubic-bezier(.2,1.4,.4,1) both;transform-origin:0 0}
  .pts{animation:thunk2 .4s .18s cubic-bezier(.2,1.5,.4,1) both}
  .shake{animation:shake .38s both}
  .pass{animation:drop .5s cubic-bezier(.2,1.3,.4,1) both}
  .scrap{animation:fly var(--t,1s) cubic-bezier(.1,.6,.4,1) forwards}
  .chip{transition:transform .08s, box-shadow .08s}
}
@keyframes tick{to{transform:translateX(-100%)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes thunk2{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}

@keyframes drop{from{transform:translateY(-40px) rotate(6deg);opacity:0}to{transform:rotate(-1.2deg);opacity:1}}

@media (prefers-reduced-motion: no-preference){
  .pin .halo{animation:halo 1.6s ease-out infinite}
  .stamped .stamp{animation:thunk .34s cubic-bezier(.2,1.5,.4,1) both}

  .dateline:nth-child(2){animation-delay:.07s} .dateline:nth-child(3){animation-delay:.14s}
  .btn,.ticket{transition:transform .06s, box-shadow .06s}
}

d idea of Ukraine ceding Donbas for Nato membership","body":"## 1. What happened\nUS negotiators floated the idea of Ukraine giving up Donbas in exchange for joining NATO, Zelensky said in comments released Saturday [2, 4, 30]. He said the question was raised for the first time during talks following the latest round in Abu Dhabi [2, 32]. Several outlets report that he would take any concrete security package to a public vote [15, 19, 35].\n\n## 2. Where coverage splits\n\n- **Ceding vs. withdrawal:** Korea Herald says Washington suggested Kyiv \"cede land to Moscow\" [4]. Kyiv Independent uses \"Donbas withdrawal\" [16], and Kyiv Post uses \"Exit Donbas\" [14].\n\n- **Naming the recipient:** Breitbart's headline says \"Ceding Donbas to Russia\" [11]. Al Jazeera says \"cede parts of Donbas to Russia\" [9], and Times of India says \"Cede Donbas to Russia\" [24]. BBC's headline names no recipient: \"Ukraine ceding Donbas\" [30].\n\n- **Who decides:** NDTV's headline says \"Ukraine Must Decide\" [21]. Ukrainska Pravda says a security package \"would go to a public vote\" [15]. Hindustan Times and DW mention a \"referendum\" [19, 35].\n\n- **Wider context:** The Hindu reports Moscow was \"betting everything\" on the winter campaign [22, 25]. Irish Times notes NATO membership is \"a red line for Moscow\" [31]. Daily Mail frames the story \"as peace talks end with no breakthrough\" [28].\n\n## 3. Loaded words\n\nFor the same proposal, outlets use different verbs and nouns:\n- \"Shock Territorial Deal\" [23] (News18)\n- \"surrendering its remaining territory\" [12] (New York Post)\n- \"Trading Donbas\" [17] (RFE/RL)\n- \"Donbas swap\" [26] (RTE)\n- \"cede\" [4, 9, 10] and \"give up\" [29, 31] are the more common verbs.\n\nOutlets also describe Donbas differently: \"eastern region\" [2], \"war-ravaged Donbas region\" [12], and \"eastern city\" [32].\n\n## 4. Mentioned by some, not others\n\n- Zelensky's rejection of ceding territory: Al Jazeera says he \"refused to cede territory to Russia\" [9]. France 24 says Kyiv was \"not willing to retreat\" [32].\n- Russia's rejection of an energy ceasefire: The Hindu [22] and Daily Mail [28].\n- Legal recognition of occupied territories: Kyiv Post says Zelensky ruled out \"categorically ruling out legal recognition\" [14].\n- Foreign peacekeepers: Euronews reports Putin \"rejected the idea of foreign peacekeeping troops\" [33].\n- Prisoner swap of \"1,200-1,300 people\": Anadolu's headline only [7].\n\nThese summaries are short. An outlet's absence from a summary does not mean it left out the fact.\n\n## Check\ncheck_quotes.py and check_outlets.py: 27 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"Xinhua","country":"China","region":"East Asia","owner":"state","lean":"","title":"Flash: Zelensky says U.S. proposed ceding Ukrainian territory in exchange for joining NATO: media","link":"https://news.google.com/rss/articles/CBMihgFBVV95cUxOeFRsd3RBZndSV1cxY0k1M0Z4NDRUazJ1bVhZQm9wYjdfUnFSQWcwTDN4VzJOU2FJRXczZ0tOOFlqTGdRZDRGSXpzM2g2bEVtcTRKNXZtTkpRZVAtSWRBTWFXbGluRU1OY1lEa3ZrS3NlajZGcFVRRTFGb09nSU40VlhQWXJ1dw?oc=5","closeness":"outside","published":"2026-11-14T09:38:45+00:00","parent":"The Chinese government (State Council)","parent_kind":"Government"},{"outlet":"South China Morning Post","country":"Hong Kong","region":"East Asia","owner":"private","lean":"","title":"Zelensky says US floated idea of Ukraine ceding Donbas for Nato membership","link":"https://www.scmp.com/news/world/europe/article/3374450/zelensky-says-us-floated-idea-ukraine-ceding-donbas-nato-membership","closeness":"outside","published":"2026-11-14T15:14:00+00:00","parent":"Alibaba Group","parent_kind":"Media group"},{"outlet":"Japan Times","country":"Japan","region":"East Asia","owner":"private","lean":"","title":"U.S. floated idea of Ukraine ceding Donbas for NATO membership","link":"https://www.japantimes.co.jp/news/2026/11/ nk":"https://www.rfi.fr/en/international/20261114-ukraine-s-relationship-with-nato-back-on-the-table-zelensky","closeness":"outside","published":"2026-11-14T16:12:40+00:00","parent":"France Médias Monde, owned by the French state","parent_kind":"Public broadcaster"}],"involved":["Ukraine","United States","Russia"],"regions":["East Asia","Middle East","North America","Russia and Eastern Europe","South Asia","UK and Ireland","Western Europe"],"outlets":34,"pic":"🗺️🛡️"},{"id":"3","sid":"s459","title":"Microsoft Says All Services Restored After Global Outage","body":"## 1. What happened\nA global Microsoft outage disrupted Outlook, Teams and other services for about a day, affecting governments, businesses and public services [2, 10, 34, 36]. Microsoft apologized and said the cause was a technical issue, not a cyber or AI attack [2, 11, 21]. By Saturday it reported services restored [7, 17, 36].\n\n## 2. Where coverage splits\n- **Cause named.** Anadolu's headline says \"technical issue, not cyberattack or AI\" [11]. News18 cites a \"Network Upgrade Error\" [20], and Times of Israel says Microsoft \"blames server issues\" [14]. The summaries do not show which account is correct.\n- **Scale.** The Print frames it as \"after outage hit 70 countries\" [31]. Express Tribune cites \"7.4m reports worldwide\" [27].\n- **Dependence.** BBC calls the event a \"stark reminder\" of reliance on big tech [34]. Express Tribune points to \"global dependence on Microsoft's workplace tools\" [27].\n- **Recovery status.** Al Jazeera says \"services still returning\" [10]. The Hill reports \"fully restored\" [17], RTE says \"services have fully recovered\" [36], and Sky News says \"all services have been fully restored\" [38].\n\n## 3. Loaded words\n- Describing the outage: Japan Times says it \"paralyzed government offices\" [6]. RTE and France 24 say it \"crippled online communications\" [36, 41]. Dawn uses \"global chaos\" [23], and DW calls it a \"glitch\" [43].\n- Severity: NY Post calls it \"historic\" [16]. The Guardian calls it \"one of the worst IT failures in years\" [37].\n- Apology: Dawn's headline uses \"deeply sorry\" [23], while The National uses \"sorry\" [8].\n- Economic impact: The Guardian says it \"could be a disaster for the Australian economy\" [35].\n\n## 4. Mentioned by some, not others\n- Downdetector's 7.4m reports [27] and the 70-country figure [31] appear in only one summary each.\n- The Guardian covers possible billion-dollar costs for Australia [35].\n- Sky News cites the NHS, police and schools in the UK [38]. Euronews covers Portugal's government, health services and schools [39, 40].\n- France 24 reports that the US homeland security chief said there was \"no Microsoft link\" to a US air traffic stoppage [41].\n- The Hindu notes Microsoft \"monitoring the backlog of email messages\" [30].\n\nSummaries are short. Absence from a summary does not mean an outlet left a fact out.\n\n## Check\ncheck_quotes.py and check_outlets.py: 22 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"Xinhua","country":"China","region":"East Asia","owner":"state","lean":"","title":"Microsoft global outage disrupts services at institutions across the Netherlands","link":"https://news.google.com/rss/articles/CBMihgFBVV95cUxQUjFnN0UycVlKd2JVWnVhYy1kcWN6dU9jRUpvTmZHNDA2aGtIWW5wRl9tbThNRDRMWldob24zdXE3U0k0LU9wSC1oTm01TDNtcmtrMXdQTjFfZ1dPVl9ONDVtcDBTVjZqZ1N5VExXVThpMVJ6WUpyek9LUlJvWm5UWTlLcHJ1Zw?oc=5","closeness":"outside","published":"2026-11-13T15:36:15+00:00","parent":"The Chinese government (State Council)","parent_kind":"Government"},{"outlet":"South China Morning Post","country":"Hong Kong","region":"East Asia","owner":"private","lean":"","title":"Microsoft ‘deeply sorry’ for global outage, says issue not caused by cyber or AI agents","link":"https://www.scmp.com/news/world/article/3374408/microsoft-deeply-sorry-global-outage-says-issue-no urope"],"outlets":33,"pic":"💻📉"},{"id":"4","sid":"s468","title":"Tanker collides with cruise ship on Mississippi River in New Orleans","body":"## 1. What happened\nA tanker struck the docked American Heritage river cruise boat on the Mississippi River in New Orleans on Friday, partially submerging it and prompting rescues [9, 32, 39]. Passenger counts are given as about 129 or 130 [9, 32], and several outlets say all passengers were accounted for [34, 40, 41].\n\n## 2. Where coverage splits\n\n- **Casualty status.** Some outlets stressed uncertainty. Daily Mail says \"it is unclear yet whether there have been any deaths or injuries\" [29], and The Hindu reports \"injuries unknown\" [20]. BBC's headline reads \"All passengers rescued\" [34].\n- **Cause.** Breitbart says the tanker \"lost control\" [14], and News18's headline says \"Tanker Loses Control\" [22]. The Guardian's headline is \"Tanker collides with cruise ship\" [27], which does not describe the tanker's state.\n- **Vessel outcome.** RT's headline says \"Tanker rams US cruise ship, capsizing it\" [17], and Daily Mail says the boat \"capsizes after being struck by tanker\" [30]. RTE uses \"partially submerged\" [32].\n- **Emphasis on video.** Daily Mail's headline begins \"Horrifying video shows\" [29], and Indian Express says \"Videos capture terrifying moment\" [25]. Al Jazeera leads with \"Rescue efforts under way\" [9].\n\n## 3. Loaded words\n\n- For the event's outcome: \"Miracle on the Mississippi\" [14] (Breitbart), \"Miracle on Mississippi\" [34, 36] (BBC, RTE), and \"Miracle of the Mississippi\" [37] (Daily Mail).\n- For the tanker's action: \"rams\" [17] (RT), \"smashed into\" [35] (Daily Mail), \"crashes\" [13] (Washington Examiner), and \"collides\" [27] (Guardian).\n- For a person: \"Hero captain\" [38] (Daily Mail).\n- For the scene: \"Horrifying\" [29], \"terrifying\" [25], and \"shocking collision\" [33] (GB News).\n\n## 4. Mentioned by some, not others\n\n- The tanker's navigation history: only the New York Post headline reports it, \"had history of navigational systems issues\" [16].\n- Dozens dragged from the river: only Times of Israel [11].\n- A river closure: The Guardian [28] and France 24 [41].\n- The mayor's comments: Breitbart [14]. Other summaries don't mention the mayor.\n- A passenger count of 197: only The News International [24].\n- The captain's refusal to leave: only Daily Mail [38].\n\nThese summaries are short, so an omission from one summary does not prove that outlet left the fact out.\n\n## Check\ncheck_quotes.py and check_outlets.py: 24 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"South China Morning Post","country":"Hong Kong","region":"East Asia","owner":"private","lean":"","title":"Tanker hits New Orleans cruise boat carrying 129 passengers","link":"https://www.scmp.com/news/world/united-states-canada/article/3374410/tanker-hits-new-orleans-cruise-boat-carrying-129-passengers","closeness":"outside","published":"2026-11-13T20:49:15+00:00","parent":"Alibaba Group","parent_kind":"Media group"},{"outlet":"Xinhua","country":"China","region":"East Asia","owner":"state","lean":"","title":"Urgent: Tanker collides with cruise ship near U.S. Port of New Orleans, rescue operations underway","link":"https://news.google.com/rss/articles/CBMijgFBVV95cUxNQWlaMnZTR0pCbzZHcU9NSmQ2RTRmTnRaeThQR2NvRERyTHhDTVZPcVdyQ2tsRDR1eUc0QzlpZHNjbkRGc0J1eV9zUm1BZUZrWEJGOXZwaGFFRTlNaVRoVkpLenJJYXdjRzlicktVRHNORU1FN0RWLTFHUGVmN2hFUmh0ZVpsbnZfdkd6UUln?oc=5","closeness":"outside","published":"2026-11-13T21:42:00+00:00","parent":"The Chinese government (State Council)","parent_kind":"Government"},{"outlet":"Xinhua","country":"China","region":"East Asia","owner":"state","lean":"","title":"Tanker collides with cruise ship near U.S. Port of New Orleans","link":"https://news.google.com/rss/articles/CBMijAFBVV95cUxPTC1ySGVDX25rRTE2eThCQ2xNZDRGbUJpTlJuYnVXSnpWa uthern Gaza, killed Samir Abu Younis, commander of Hamas's Rafah Brigade [6, 25]. Hamas's armed wing, the Al-Qassam Brigades, confirmed his death [5, 24], and the Israeli military said it had targeted him [2, 7]. Several summaries say he helped plan the October 7 attack [2, 11, 24].\n\n## 2. Where coverage splits\n- **Ceasefire context:** The New Arab says he was killed \"despite the ceasefire\" [11], and Firstpost says \"despite Gaza ceasefire\" [21]. Most other summaries do not mention a ceasefire.\n- **Who says he was killed:** CGTN's headline is \"Hamas says senior armed commander killed\" [1]. Ynetnews says \"reportedly eliminated\" [3], Daily Times says \"Israel claims\" [22], and The Hill says \"Israel reported\" [13]. BBC says \"officials say\" [25].\n- **Whether the target was identified:** Times of Israel reports the IDF \"yet to identify target\" [7]. GB News says the military \"did not identify him\" [23]. Other summaries say the Israeli military confirmed the death [2, 26].\n- **Headline focus:** Ukrinform leads with \"Israel strikes Hamas military wing\" [14]. Times of Israel leads with \"Chief of Hamas's Rafah Brigade killed\" [9]. Daily Mail leads with the attack's planning role: \"who helped mastermind October 7 attacks\" [28].\n\n## 3. Loaded words\n- For the attack's role: Daily Mail says \"helped mastermind\" [28], Politico says \"helped plan and oversee the Oct. 7 massacre\" [29], and Sky says \"helped plan and oversee the 7 October 2023 attack\" [24].\n- For the group: GB News uses \"terror group\" [23], while Sky uses \"Palestinian militant group\" [24].\n- For the killing: Ynetnews uses \"eliminated\" [3]. Most others use \"killed\" [e.g., 2, 6, 26].\n- For the target: the IDF is quoted as calling him a \"senior terrorist in Hamas's military wing\" [7].\n\n## 4. Mentioned by some, not others\n- His predecessor's death: Times of Israel's headline says \"2 months after predecessor\" [9]. Business Recorder names predecessor Nael Abu Obeid, killed September 15 [20]. Politico says he took control \"just two months ago\" [29].\n- Funeral: Times of India says it is \"set for Sunday\" [16].\n- Civilian harm: Daily Mail reports the IDF said \"steps were taken to mitigate harm to civilians\" [28].\n- Background: GB News says he \"joined the terror group's armed wing in 1991\" [23].\n- Location detail: Mawasi area is named by [18, 23].\n\nThese summaries are short. An outlet's absence from a point does not mean it omitted the fact.\n\n## Check\ncheck_quotes.py and check_outlets.py: 25 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"CGTN","country":"China","region":"East Asia","owner":"state","lean":"","title":"Hamas says senior armed commander killed in Israeli strike","link":"https://news.cgtn.com/news/2026-11-15/Hamas-says-senior-armed-commander-killed-in-Israeli-strike-1S5gM102H28/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World","closeness":"outside","published":"2026-11-15T01:58:03+00:00","parent":"China Media Group, under the Chinese Communist Party","parent_kind":"Government"},{"outlet":"South China Morning Post","country":"Hong Kong","region":"East Asia","owner":"private","lean":"","title":"Top Hamas commander killed in Israeli strike in Gaza","link":"https://www.scmp.com/news/world/middle-east/article/3374498/top-hamas-commander-killed-israeli-strike-gaza","closeness":"outside","published":"2026-11-15T12:02:08+00:00","parent":"Alibaba Group","parent_kind":"Media group"},{"outlet":"Ynetnews","country":"Israel","region":"Middle East","owner":"private","lean":"","title":"Hamas Rafah brigade chief reportedly eliminated in Israeli strike in Khan Younis","link":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1TVzAwY2JxbjM1NDlCV2wxRk9PZ1ctSE9kRThIbEpJOUhxN1JSYzVOTU05dElqeFVUakFpZUpaekNhM2I1a3UxTWlEa1ExX0VFWWxaV19B?oc=5","closeness":"involved","published":"2026-11-14T23:17:15+00:00","parent":"Yed channel=rss&ns_campaign=1490&ito=1490","closeness":"outside","published":"2026-11-15T10:25:14+00:00","parent":"DMG Media, part of Daily Mail and General Trust (Rothermere family)","parent_kind":"Family-owned"},{"outlet":"Politico Europe","country":"Belgium","region":"Western Europe","owner":"private","lean":"centre","title":"Israel kills Hamas commander in Gaza strike","link":"https://www.politico.eu/article/israel-kills-hamas-commander-in-gaza-strike/?utm_source=RSS_Feed&utm_medium=RSS&utm_campaign=RSS_Syndication","closeness":"outside","published":"2026-11-15T09:43:15+00:00","parent":"Axel Springer","parent_kind":"Media group"}],"involved":["Palestine","Israel"],"regions":["East Asia","Middle East","North America","Russia and Eastern Europe","South Asia","UK and Ireland","Western Europe"],"outlets":28},{"id":"6","sid":"s638","title":"FAA lifts nationwide ground stop after massive US flight disruption","body":"## 1. What happened\nThe FAA issued a nationwide ground stop on Friday after a communications problem affecting air traffic control centers [19, 55]. It was lifted after about four hours [31, 68]. Officials blamed aging equipment and said there was no evidence of a cyberattack [67, 68].\n\n## 2. Where coverage splits\n- **Cyberattack question:** Hindustan Times headlined that an FAA employee said \"Wouldn't rule out cyberattack\" [45]. France 24 reported \"no evidence of a cyber attack\" [68].\n- **Cause:** Xinhua led with officials who \"blames outdated air traffic control system\" [6]. The Guardian's headline used \"temporary telecommunications outage\" [55], which does not name outdated equipment in the summary.\n- **Severity:** Daily Mail called it a \"catastrophic ground stop\" [63]. Anadolu quoted Homeland Security Secretary Markwayne Mullin: \"the public was never at danger\" [16].\n- **Political focus:** The Hill headlined \"call for $50B air travel 'overhaul'\" [34]. Daily Mail focused on a \"Awkward moment\" in the briefing [63].\n- **History:** RTE described \"the longest nationwide shutdown since the 11 September 2001\" [58]. Kyiv Independent wrote it was \"only the second nationwide ground stop of U.S. departures\" [41]. France 24 said \"the longest in the country since September 11, 2001\" [68].\n\n## 3. Loaded words\n- For the event: \"outage\" [46], \"failure\" [58], \"issue\" [19], \"malfunction\" [63], \"disruption\" [17].\n- For the briefing: \"fiery\" [34] (The Hill), \"Awkward moment\" [63] (Daily Mail).\n- For the officials' explanation: \"excuses\" [63] (Daily Mail, in \"stumbles over excuses\").\n- For a critic's view: \"shakedown for more money\" [37] (The Hill, quoting Marjorie Taylor Greene).\n\n## 4. Mentioned by some, not others\n- **Flight counts differ:** 7,000 [42], about 3,500 [50], over 8,200 [68], nearly 10,000 [9], and over 14,000 [47]. These may reflect different times or measures, which the summaries do not explain.\n- **Microsoft:** Anadolu reported Microsoft's denial of a link [14]. Korea Herald [8] and France 24 [65] mention a Microsoft outage; others do not.\n- **AI:** The New York Post noted a new AI tool rolled out days earlier [21]. Daily Mail raised an AI system as a possible cause [54]. Hindustan Times reported Trump's denial of AI involvement [49].\n- **Sports impact:** College football [23, 24, 36, 40], NFL [22], and a postponed Cornell basketball game [29] appear in some summaries only.\n- **Canada:** Anadolu reported Canada's systems were operating normally [15].\n\nSummaries are short, so an omission here does not prove an outlet left a fact out. No nonprofit outlets appear in the data, so their coverage cannot be compared.\n\n## Check\ncheck_quotes.py and check_outlets.py: 21 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"Japan Times","country":"Japan","region":"East Asia","owner":"private","lean":"","title":"U.S. cancels rare nationwide ground halt for all flig endowment fund set up by Xavier Niel","parent_kind":"Nonprofit or trust"}],"involved":["United States"],"regions":["East Asia","Middle East","North America","Russia and Eastern Europe","South Asia","UK and Ireland","Western Europe"],"outlets":26,"pic":"✈️🛑"},{"id":"7","sid":"s811","title":"Watch: SpaceX catches Starship in midair on return to launch tower","body":"## 1. What happened\nSpaceX's Starship returned from a roughly 22-hour orbital flight on Saturday and was caught by the mechanical arms of its Texas launch tower [5, 8, 15, 24]. The first-stage booster exploded or failed its own recovery, so the planned double catch did not happen [1, 15, 23].\n\n## 2. Where coverage splits\n\n- **Booster outcome:** Several outlets put the booster failure in the framing. The Irish Times says the company \"falls short of desired double capture\" [23]. The Guardian's headline calls the result a \"victory for company\" [24]. Global Times's summary mentions only the catch [2].\n- **Overall verdict:** Anadolu's headline says SpaceX \"makes history\" [5]. Al Jazeera says the Starship \"nails a smooth return\" [7]. GB News calls it a \"major breakthrough\" [25].\n- **Sourcing:** Al Jazeera attributes its claim to \"SpaceX officials say\" [6]. The Hill's headline says the catch is \"drawing praise in Washington\" [12]. Euronews quotes the company, which said it \"changed everything\" [27].\n- **Purpose of the catch:** Al Jazeera ties it to \"rapid, low-cost recycling\" [6]. The Guardian ties it to \"suitable for human spaceflight\" [24]. Israel Hayom ties it to \"a fully reusable rocket\" [8].\n\n## 3. Loaded words\n\n- Return described as \"triumphant\" [1, 7, 10].\n- Event described as \"dramatic\" [6, 10, 14] and \"stunning\" [20].\n- Catch described as \"magic,\" in a quote from NASA Administrator Jared Isaacman [11].\n- Booster outcome: \"aborted\" [3, 26], \"missed\" [8], \"failed\" [15, 26], \"exploded\" [23, 24].\n- Arms described as \"mechanical arms\" [22] or \"chopsticks\" [22, 25].\n- Rocket described as a \"megarocket\" [21, 24].\n\n## 4. Mentioned by some, not others\n\n- The Times of India says the spacecraft deployed 26 satellites [15]. No other summary mentions this.\n- The Hindu says SpaceX expects to launch Starships from Florida \"within the next few months\" [14].\n- Times of India says the heat shield \"performed well\" [15].\n- Euronews describes crowds that \"erupted into cheers\" [27].\n- Only the New York Post quotes Isaacman [11].\n\nThese summaries are short. Absence from a summary does not mean an outlet left a fact out. Also, no nonprofit outlets appear in this set.\n\n## Check\ncheck_quotes.py and check_outlets.py: 25 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"South China Morning Post","country":"Hong Kong","region":"East Asia","owner":"private","lean":"","title":"SpaceX successfully carries out first-ever spaceship catch","link":"https://www.scmp.com/news/world/united-states-canada/article/3374463/spacex-successfully-carries-out-first-ever-spaceship-catch","closeness":"outside","published":"2026-11-14T21:32:46+00:00","parent":"Alibaba Group","parent_kind":"Media group"},{"outlet":"Global Times","country":"China","region":"East Asia","owner":"state","lean":"","title":"SpaceX’s Starship successfully captured by the launch tower arms","link":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9ZdFdDcXB4QTk2bUdEUG1lb1RlX1JiZUg0V3RaWjJMZmhrbXFXTWxLaTFZZWx4dlN1MlQ4Si14ZTg2bU8zU0luMXp4Q21GZFBGekNkeDl1YzYxbXJKalBDWUhR?oc=5","closeness":"outside","published":"2026-11-15T12:28:00+00:00","parent":"People's Daily, the Chinese Communist Party's newspaper","parent_kind":"Government"},{"outlet":"Asharq Al-Awsat English","country":"Saudi Arabia","region":"Middle East","owner":"private","lean":"","title":"SpaceX's Starship Set for Return to Earth After Booster Catch Aborted","link":"https://english.aawsat.com/node/53 "closeness":"outside","published":"2026-11-15T08:32:33+00:00","parent":"Alpac Capital","parent_kind":"Investment firm"},{"outlet":"Euronews","country":"France","region":"Western Europe","owner":"private","lean":"","title":"Watch: SpaceX catches Starship in midair on return to launch tower","link":"https://www.euronews.com/video/2026/11/15/watch-spacex-catches-starship-in-midair-on-return-to-launch-tower","closeness":"outside","published":"2026-11-15T10:05:49+00:00","parent":"Alpac Capital","parent_kind":"Investment firm"}],"involved":[],"regions":["East Asia","Middle East","North America","Russia and Eastern Europe","South Asia","UK and Ireland","Western Europe"],"outlets":25,"pic":"🚀🗼"},{"id":"8","sid":"s888","title":"‘How to save the next Jensen Huang from himself’","body":"## 1. What happened\nJensen Huang resigned as Nvidia's CEO. Tehran Times places the resignation on Thursday [3], and South China Morning Post says it came a day before a South Korean ministry meeting with Nvidia officials [2]. Several outlets link the exit to scrutiny of China-linked AI chip sales [3, 9], and a Denny's in San Jose removed a plaque marking Nvidia's founding [10, 12, 22].\n\n## 2. Where coverage splits\n\n- **Naming the scandal.** Kyiv Post calls it a \"$5 Trillion Espionage Scandal\" [8]. Tehran Times calls it \"an export-control scandal\" [3], and New York Post calls it Huang-led \"corporate scandals\" [7]. Daily Mail refers to a \"CEO's affairs scandal\" [22].\n- **Huang's standing.** South China Morning Post uses \"disgraced CEO Jensen Huang\" [2]. Tehran Times calls him \"the indispensable supplier of the AI boom\" [3], and The Hindu describes \"a stunning fall from grace\" [16].\n- **Who benefits.** New York Post says the fall is \"a massive win for short sellers\" [7]. DD News says \"Beijing stands to benefit\" [17]. NDTV's headline asks \"How Jensen Huang's Fall Could Help AMD's Lisa Su\" [11].\n- **Personal conduct versus policy.** New York Post's headline focuses on how Huang \"reportedly unraveled\" [4]. Tehran Times asks about the \"Trump administration\" and what it \"supposedly failed to contain\" [3]. Indian Express points to \"top Trump aide's report\" [20].\n\n## 3. Loaded words\n\n- For Huang: \"disgraced CEO\" [2], \"AI rainmaker\" [16], \"ousted CEO\" [17], \"AI founder\" [13].\n- For the event: \"exit\" [2, 11], \"resignation\" [3], \"ouster\" [7], \"implosion\" [7], \"Waterloo\" [16].\n- For the scandal: \"Espionage Scandal\" [8] versus \"export-control scandal\" [3] and \"China-Linked AI Chip Sales\" [9].\n\n## 4. Mentioned by some, not others\n\n- NDTV says Trump \"has supported Huang through the scandal\" [14], and that their ties are \"Under Congress Scanner\" [14]. Tehran Times refers to the Trump administration [3], but these summaries do not mention Congress.\n- BBC links the scandal to Singapore and \"alleged illicit trade\" [21]. No other summary mentions Singapore.\n- Euronews gives a market figure: Nvidia \"has lost about $1.8tn (€1.6tn) in market value\" [23].\n- Firstpost reports an engineer's resignation and \"Not felt heard\" [19].\n- DD News mentions Elon Musk [17], and South China Morning Post mentions \"remarks by Elon Musk\" [2].\n\nThese summaries are short. Missing a fact from a summary does not mean an outlet left it out of its full article.\n\n## Check\ncheck_quotes.py and check_outlets.py: 32 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"Taipei Times","country":"Taiwan","region":"East Asia","owner":"private","lean":"","title":"Chip suppliers shrug off Huang’s exit","link":"https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867695","closeness":"outside","published":"2026-11-14T00:00:00+00:00","parent":"Liberty Times Group (Lin family)","parent_kind":"Family-owned"},{"outlet":"South China Morning Post","country":"Hong Kong","region":"East Asia","owner":"private","lean":"","title": verage splits\n- **Attribution of the attack.** China Daily gives the claim as fact: \"Iran targets US radar in Bahrain\" [1]. DW's summary attributes it: \"Iran claimed it struck US radar systems in Bahrain\" [13].\n- **Lead angle.** NDTV leads with the denial: \"US Denies Iran Targeted Bahrain's Radar System\" [11]. The Print and Hindustan Times do the same [10, 12], as does the Washington Examiner: \"US denies Iran claims it destroyed military radar in Bahrain\" [7].\n- **Stated motive.** Breitbart cites \"a U.S. airstrike on an Iranian port Thursday night\" [8]. RT cites \"US attacks on Iranian civilian areas\" [9].\n- **Wider framing.** The Washington Examiner calls it \"the first attack of its kind in months\" [7]. Breitbart's headline adds \"LNG Tanker in Strait of Hormuz\" [8].\n\n## 3. Loaded words\n- For the Iranian act: \"claims\" [8, 13], \"says\" [2, 4, 5, 6], \"targets\" [1, 5, 9], \"destroyed\" [7] or \"claimed to have destroyed\" [8], \"hit\" [2], \"struck\" [13].\n- For the US response: \"denies\" [7, 10, 11, 12], \"shot down\" [11, 12], \"intercepted\" [13].\n- For the attacks themselves: \"aerial attacks\" [5], \"drone strikes\" [6].\n\n## 4. Mentioned by some, not others\n- Six drones: Anadolu [4], Al Jazeera [6], RT [9].\n- Bahraini Interior Ministry warnings hours earlier: Anadolu only [4].\n- Iran repeatedly targeting Bahrain earlier in the war: NDTV only [11].\n- Two drones, per the US military: Hindustan Times only [12].\n- Sporadic strikes after intensive strikes halted: Washington Examiner only [7].\n- \"De-escalation\" context: DW only [13].\n\nThese summaries are short. An outlet's absence from a list does not mean it left the fact out of its full article. No UK, Irish, or nonprofit outlets are included.\n\n## Check\ncheck_quotes.py and check_outlets.py: 21 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"China Daily","country":"Chin m 18 Muslim-majority countries\" [5], \"Arab League condemns\" [10], \"Seventeen nations condemn\" [14], and \"Pakistan, 16 other countries\" [12, 13].\n\n## 3. Loaded words\nFor the same act of condemnation, outlets used \"slam\" [4], \"blast\" [8], \"denounce\" [3], and \"condemn\" [6]. For the deaths, Tehran Times uses \"killed\" [2], while The Intercept uses \"Kill\" [11]. Descriptions of the event include \"unspeakable horror\" [16], \"deadliest single strike\" [13], and \"catastrophic humanitarian crisis\" [15]. The word \"murder\" appears only in a quote from a U.S. doctor [11].\n\n## 4. Mentioned by some, not others\n- A surgeon among the dead: [1, 2]\n- A 13-year-old boy among the dead: [13]\n- The U.S.-made missile: [11]\n- Hospital bombed repeatedly in past years: [17]\n- The Sharm El-Sheikh Agreement: [15]\n- Israel's recent elections: [13]\n- Winter approaching: [7, 15]\n\nThese summaries are short. Absence from a summary does not prove an outlet omitted a fact.\n\n## Check\ncheck_quotes.py and check_outlets.py: 22 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"Daily Sabah","country":"Turkey","region":"Middle East","owner":"private","lean":"","title":"World outrage mounts after Israeli strike kills 6 at Gaza hospital","link":"https://www.dailysabah.com/world/mid-east/world-outrage-mounts-after-israeli-strike-kills-6-at-gaza-hospital","closeness":"outside","published":"2026-11-13T08:54:00+00:00","parent":"Turkuvaz Media Group (Kalyon Group)","parent_kind":"Media group"},{"outlet":"Tehran Times","country":"Iran","region":"Middle East","owner":"state","lean":"","title":"Six, including a surgeon, killed in Israeli strike on Nasser Hospital in Gaza","link":"https://www.tehrantimes.com/news/532097/Six-including-a-surgeon-killed-in-Israeli-strike-on-Nasser","closeness":"outside","published":"2026-11-13T14:12:04+00:00","parent":"Islamic Propagation Organi sels: most say two [1, 5, 14, 20, 25], while others say three [10, 23, 24]. The summaries present the incident as Iranian claims [4, 14].\n\n## 2. Where coverage splits\n\n- **Verification status.** Anadolu notes the incident is \"independently unverified\" [14]. The summaries from other outlets do not say whether it was verified [e.g., 1, 4].\n\n- **Rule-breaking.** Mehr News says a vessel struck a mine \"after ignoring repeated warnings\" [3] and calls one tanker \"Yet another violating oil tanker\" [13]. Hindustan Times reports the navy \"claiming two were violating restricted routes\" [23].\n\n- **US involvement.** TASS says the vessel \"attempted to transit under the cover of US fighter jets\" [19]. News18's headline reads \"IRGC Accuses Ships Of Secret Crossing\" [25].\n\n- **Wider war context.** The New Arab frames the event as \"Iran war escalates as oil tankers hit mines\" [11]. The Hindu says \"Tankers are still facing attacks across the strait\" [21] and links this to \"falling oil prices\" [21].\n\n## 3. Loaded words\n\n- **Vessels' passage:** \"violating\" [1, 13], \"unauthorized\" [3, 5, 17], \"Accuses\" [25], \"undetected\" [17]. Each describes the same transit differently.\n- **The explosion:** \"explodes\" [2, 8], \"exploded\" [3], \"caught fire\" [4, 5], \"aflame\" [24].\n\n## 4. Mentioned by some, not others\n\n- A US drone shootdown appears only in \"Iran downs 17th US MQ-1 drone\" [16].\n- Trump's comment appears only in \"may hold off on Iran attacks\" [11].\n- Anadolu alone mentions that radar and positioning systems were \"switched off\" [5].\n- Only TASS gives the day as \"on Friday\" [19]; Mehr [9] and Hindustan Times [23] say \"on Saturday.\"\n- These are short summaries, so an omission does not mean an outlet left a fact out. Also, all 25 articles come from Middle East, South Asian, East Asian, and Russian or Eastern European outlets. No North American or Western European outlets appear in this set.\n\n## Check\ncheck_quotes.py and check_outlets.py: 22 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"Xinhua","country":"China","region":"East Asia","owner":"state","lean":"","title":"Iran's IRGC says 2 \"violating\" tankers caught fire after hitting mines in Hormuz Strait","link":"https://news.google.com/rss/articles/CBMifEFVX3lxTE5QSHEyQ0JUSDZXX0xfY1d3czB2ZVFpZ3hYb3RRZnZ0eGlCU2c0Y1dMRTRiQnJodmxrTEF6TWxfRXhKeElZeWZONDhsdWJUY0ZCQ0tJZm44VVd5S0kzQUR3MTFxOWNJX2ljTS1tdWNrOUhtVDVIcmRzLU8wcE8?oc=5","closeness":"outside","published":"2026-11-13T21:41:45+00:00","parent":"The Chinese government (State Council)","parent_kind":"Government"},{"outlet":"Middle East Eye","country":"UK","region":"Middle East","owner":"private","lean":"","title":"IRGC Navy says tanker explodes after hitting a sea mine in Hormuz Strait","link":"https://news.google.com/rss/articles/CBMiwgFBVV95cUxQd2dTUWdrVUVvWUlVWFFTS0JDMmpPbUw5SWoxUXZ1MUNySU9kUGdpVGk1UVJRWEg5elhqbXhZQzcxZEpwVHp3elNNR2loVnJLU05XTERYU2RzT0VyOGVDbVBLaGxjSmRVbFhFTXZjWm9Yd0F2ZTNsdng4U1ZPajFpOUJ2bDVZRTh6U1dBQWVvVWh3cW5kX0JJN05yak95M2RVc2tFbXpEaTdRS18zeHVvbTMtVzZoakRJbm1DMmRaRl9sZw?oc=5","closeness":"outside","published":"2026-11-13T07:17:00+00:00","parent":"Middle East Eye Ltd; owners not publicly disclosed","parent_kind":"Not disclosed"},{"outlet":"Mehr News","country":"Iran","region":"Middle East","owner":"state","lean":"","title":"LPG carrier explodes after hitting sea mine in Hormuz: IRGC","link":"https://en.mehrnews.com/news/249367/Liquefied-gas-carrier-blasts-after-hitting-sea-mine-in-Hormuz","closeness":"state","published":"2026-11-13T07:21:23+00:00","parent":"Islamic Ideology Dissemination Organization, an Iranian state body","parent_kind":"Government"},{"outlet":"Al Jazeera English","country":"Qatar","region":"Middle East","owner":"state","lean":"","title":"IRGC says tanker caught fire after hitting mines in Strait of Hormuz","link":"https://www.aljazeera.com/vi s \"high-stakes Trump-Xi meeting\" [7]. Business Recorder writes \"expected leaders’ meeting in Shenzhen next week\" [10].\n- The leaders are named in different order: \"Trump-Xi\" [7] and \"Xi-Trump\" [8, 10, 11].\n- For the talks, CGTN uses \"pledge to stabilize trade ties\" [2], while China Daily uses \"discuss tariffs, farm trade\" [1].\n\n## 4. Mentioned by some, not others\n\n- The Shenzhen leaders' meeting appears in the summaries of The New Arab, Business Recorder and Daily Times [7, 10, 11]. It is absent from the other summaries. Several articles have no summary, so absence is not proof that an outlet left it out.\n- The tariff figures differ: Express Tribune cites a \"$60b package\" [8], and Business Recorder cites a \"$30 billion-for-$30 billion\" arrangement [10].\n- Only CGTN mentions that the meeting was held \"via video conference\" [2].\n\n## Check\ncheck_quotes.py and check_outlets.py: 15 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"China Daily","country":"China","region":"East Asia","owner":"state","lean":"","title":"China, US discuss tariffs, farm trade at first trade council meeting","link":"https://news.google.com/rss/articles/CBMigAFBVV95cUxOMExwS1BRX0ZPY0RlR290ck9NT0dQLXM1QnBhNi1SdWpNT05ELWhqb2M4ZWMtR0tCV3lONV9YQVczdkJFTkkwMHJNNE8zcXUzaGRHZ0FuWjhMRWRURlJxaGxab2FaWEdFaUhRLTBWOVVuaWo5MDNjTlRpRjdhaXR5bA?oc=5","closeness":"state","published":"2026-11-14T08:07:19+00:00","parent":"The Chinese Communist Party","parent_kind":"Government"},{"outlet":"CGTN","country":"China","region":"East Asia","owner":"state","lean":"","title":"China, US pledge to stabilize trade ties in first council meeting","link":"https://news.cgtn.com/news/2026-11-14/China-US-pledge-to-stabilize-trade-ties-in-first-council-meeting-1S42eJ7XDc4/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World","closeness":"state","published":"2026-11-14T11:58:28+00:00","parent":"Chi ing","closeness":"outside","published":"2026-11-14T21:35:33+00:00","parent":"Business Recorder Group (Zuberi family)","parent_kind":"Family-owned"},{"outlet":"Daily Times","country":"Pakistan","region":"South Asia","owner":"private","lean":"","title":"China, US discuss tariffs, farm trade ahead of Xi-Trump meeting","link":"https://dailytimes.com.pk/1581727/china-us-discuss-tariffs-farm-trade-ahead-of-xi-trump-meeting/","closeness":"outside","published":"2026-11-15T06:04:37+00:00","parent":"Media Times Ltd (Taseer family)","parent_kind":"Family-owned"}],"involved":["China","United States"],"regions":["East Asia","Middle East","South Asia"],"outlets":10,"pic":"📦🌾"},{"id":"97","sid":"s961","title":"Yemen government forces withdraw from area near Bab el-Mandeb Strait, Houthis in control","body":"## 1. What happened\nYemeni forces aligned with the internationally recognized government announced on Sunday that they were withdrawing from an area overlooking the Bab el-Mandeb Strait [4, 6, 9]. Several summaries say the move leaves the Houthis in control of, or with greater leverage over, the strait [3, 5, 6, 8]. The summaries do not give a full account of the fighting.\n\n## 2. Where coverage splits\n- **Who gained:** Tehran Times describes an advance by Yemeni forces: \"Yemeni forces complete Aden encirclement\" [1]. Ynetnews and the Financial Times focus on the Houthis: \"tighten grip on vital Red Sea strait\" [2] and \"win for Houthis\" [9].\n- **Stated purpose:** The Financial Times says the withdrawal is \"in order to protect de facto capital Aden\" [9]. Times of India says it \"is aimed at bolstering security in Aden\" [8]. The other summaries give no stated purpose.\n- **Shipping stakes:** Business Recorder calls the area \"a potent pressure point on global shipping\" [6]. The National says it \"hands Houthis greater leverage over Bab Al Mandeb\" [3].\n\n## 3. Loaded words\n- **Armed groups:** Tehran Times uses \"Saudi-backed militants\" [1] and the Financial Times uses \"Iran-linked militants\" [9]. The New Arab uses \"Iran-backed Houthis\" [5]. Tehran Times uses \"Ansarallah movement\" [1], where other outlets use \"Houthis\" [2–9].\n- **Government move:** Ynetnews and the Financial Times use \"retreat\" [2, 9]. The National uses \"pullback\" [3]. Others use \"withdraw\" or \"withdrawing\" [4, 5, 6, 7, 8].\n- **Houthi gains:** \"tighten grip\" [2], \"cement foothold\" [8], \"win for Houthis\" [9].\n\n## 4. Mentioned by some, not others\n- Business Recorder alone reports that \"Houthis say they attacked Saudi tankers in the Red Sea\" [6].\n- Business Recorder also links the events to the wider conflict: \"Iran continues to disrupt traffic through the Strait of Hormuz\" [6].\n- Times of India alone says the withdrawal \"follows a previously established truce that has now collapsed\" [8].\n- Tehran Times alone describes the \"Aden Province\" encirclement [1].\n\nThese summaries are short. Absence from a summary does not prove an outlet omitted a fact; it may only reflect the summary's length.\n\n## Check\ncheck_quotes.py and check_outlets.py: 23 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"Tehran Times","country":"Iran","region":"Middle East","owner":"state","lean":"","title":"Yemeni forces complete Aden encirclement","link":"https://www.tehrantimes.com/news/532098/Yemeni-forces-complete-Aden-encirclement","closeness":"state","published":"2026-11-13T16:03:45+00:00","parent":"Islamic Propagation Organization, an Iranian state body","parent_kind":"Government"},{"outlet":"Ynetnews","country":"Israel","region":"Middle East","owner":"private","lean":"","title":"Houthis tighten grip on vital Red Sea strait as Yemeni government forces retreat","link":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1Pek15bnJoN0dKYTBRRUhuQVBoTjF4cVJHYmlFLS1ZNWtUQ3J0NWJkcDZnNWdUZklaMEljQUlYODloNEtQMWJDZ0p0Q1pjYkZhanUyQ0hR?oc=5","closeness":"ou  1. What happened\nChina's electric commercial aircraft, a 10-ton-class plane, completed its first crewed or piloted flight [2, 4, 5, 6, 7, 10, 11]. Most outlets agree on this core event, though wording varies. Two Global Times articles cover a different event, a test flight of an unmanned cargo aircraft [8, 9].\n\n## 2. Where coverage splits\n- **Developer origin:** Global Times says \"domestically developed 10-ton-class\" [3]. Xinhua says \"independently developed 10-tonne electric aircraft\" [5], and China Daily says \"independently developed 10-ton electric aircraft\" [6]. The Hindustan Times and Euronews summaries do not describe who developed the aircraft [10, 11].\n- **Aircraft type:** Euronews says \"Chinese electric passenger plane\" [11]. Global Times says \"10-ton electric commercial aircraft\" [2], and Xinhua says \"10-tonne electric commercial aircraft\" [4].\n- **Flight description:** China Daily says \"first piloted test flight\" [1]. Global Times says \"successful maiden manned flight\" [2] and \"first crewed intelligent flight\" [3].\n- **Model name:** China Daily names \"COMAC's electric aircraft\" [1]. Hindustan Times says \"China's electric aircraft CE-25A\" [10], and Euronews says \"a CE-25A\" [11].\n\n## 3. Loaded words\n- Same event: \"maiden\" [2] versus \"first\" [4, 5].\n- Same aircraft: \"passenger plane\" [11] versus \"commercial aircraft\" [2, 4].\n- Same flight: \"test flight\" [1] versus \"piloted flight\" [5, 6, 7].\n- Same origin: \"domestically developed\" [3] versus \"independently developed\" [5, 6, 7].\n- Same flight: \"intelligent\" [3] appears only in this article.\n\n## 4. Mentioned by some, not others\n- Location Binzhou, Shandong, and a flight of \"around 60 kilometres\" appear only in Euronews [11].\n- The aircraft \"performed as expected\" with systems \"within normal operating parameters\" appears only in Hindustan Times [10].\n- Inner Mongolia appears only in Global Times's unmanned-aircraft summary [9].\n\nThese are short summaries, so a fact missing from one is not proof that the outlet left it out. The set also includes no outlets from several regions, so these comparisons are limited.\n\n## Check\ncheck_quotes.py and check_outlets.py: 24 quoted phrases, all found in the articles they cite; no outlet mix-ups; every citation points to a real article.\nStatus: Ready.\n","articles":[{"outlet":"China Daily","country":"China","region":"East Asia","owner":"state","lean":"","title":"COMAC's electric aircraft completes first piloted test flight","link":"https://news.google.com/rss/articles/CBMifkFVX3lxTE93R0NSbzMwYmo5TGF5NVgxWDJWZVhLZXdxT2c2TlNPaEt5NUNyRGZlcUZiWDBhbm95SHBCQTlwMGVyQjRlR1dkVi0xQzlmRUYtSWNzZDZ5XzMzOHlXejkyODZ3S0pEX2pTZ1hKaWJxYzgyeTItZkdXb0xhd3FXdw?oc=5","closeness":"state","published":"2026-11-14T05:34:23+00:00","parent":"The Chinese Communist Party","parent_kind":"Government"},{"outlet":"Global Times","country":"China","region":"East Asia","owner":"state","lean":"","title":"China's 10-ton electric commercial aircraft makes successful maiden manned flight","link":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1TOGo4VTltdmNDUEVfTjg3Z1lkNktPUnMyOTJwWHBsbnNPQ2szQ1F4eHVZN2EwaUEtclJISnlGRndzMnpheVVkaDR5REZ1OW9CZEtLZ2VCNGVrdGdLaGwtWFNB?oc=5","closeness":"state","published":"2026-11-14T06:13:00+00:00","parent":"People's Daily, the Chinese Communist Party's newspaper","parent_kind":"Government"},{"outlet":"Global Times","country":"China","region":"East Asia","owner":"state","lean":"","title":"China’s domestically developed 10-ton-class electric commercial aircraft completes its first crewed intelligent flight","link":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9kb3JKc3BleFhZbzhrdWc3WncySEh3SHFhb2ZWMFhYdWpnWDRIcGVOeDB1akVNOGtQd3Y2Qi0zZ2xZMkthQzRqT3ZBRW5DQ1lHTTZ5ZVl4Q1pVTW1RN01RTVhn?oc=5","closeness":"state","published":"2026-11-14T06:42:00+00:00","parent":"People's Daily, the Chinese Communist Party's newspaper","parent_kind":"Government"},{"outlet":"Xinhua","country":     <p class="legend">${keys.map(k => `<span><i style="background:${colorOf(k)}"></i>${esc(nameOf(k))} ${pct(counts[k], n)}%</span>`).join("")}</p>`;
}
const regionColor = k => `var(--r${REGION_ORDER.indexOf(k) + 1})`;

function timeline(s){  // first reported by, and how the coverage spread over time

  if (dated.length < 2) return "";
  const t0 = dated[0].t, t1 = dated[dated.length - 1].t, span = Math.max(1, t1 - t0), hrs = Math.round(span / 36e5);

function play(keepScroll, fresh){
  if (!R) { location.hash = ""; return; }
  const g = game();
  if (cur === null || cur >= R) { cur = g.picks.findIndex(p => p === null); if (cur < 0) { location.hash = "result"; return; } }
  const r = ROUNDS[cur], s = BY[r.sid], pick = g.picks[cur], shown = pick !== null, m = r.options[r.answer], right = pick === r.answer;
